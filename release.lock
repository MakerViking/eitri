# release.lock — the pinned manifest for an Eitri release.
#
# Every third-party input that an Eitri image or update bundle is built from is
# listed here with the exact version and the source it was resolved from.
# Git-based inputs are pinned to a full 40-hex commit; downloaded artifacts are
# pinned to a SHA-256 digest.
#
# Fields:
#   version   human-readable version or tag
#   commit    full commit SHA the tag or branch resolved to (git sources)
#   source    where the pinned input is fetched from
#   sha256    digest of the downloaded artifact (tarballs and binaries)
#   verified  date the pin was last checked against its remote (YYYY-MM-DD)
#   tested    true only after the pin has been exercised on real hardware
#
# A field that has not been resolved yet is left out, never filled with a
# placeholder. Edit this file through the release tooling, or by hand together
# with a re-check of every value you change.

schema = 1
project = "eitri"
release_status = "pre-alpha"   # no release has been built or flashed yet


# Eitri macros for the QIDI X-Plus 4 (Klipper and Kalico).
#
# Written for Eitri. Machine coordinates (waste chute, wipe strip), the
# sensorless homing currents and the general shape of the start/pause/cancel
# flow follow QIDI's stock Plus 4 gcode_macro.cfg (QIDITECH/QIDI_PLUS4); the
# Qidi Box/AMS, T0-T15 tool changes, the dual-probe switching, REVERSE_HOMING
# and the per-print SAVE_CONFIG were intentionally left out. See README.md.
#
# Tunables live in [gcode_macro _EITRI_CFG]; override them from your own
# printer.cfg with a section of the same name rather than editing this file.

[gcode_macro _EITRI_CFG]
description: Tunables for the Eitri macros
# Waste chute / wipe strip at the rear-left of the bed (machine coordinates)
variable_trash_x: 95.0
variable_trash_y: 324.0
variable_trash_approach_x: 56.0
variable_wipe_x1: 58.0
variable_wipe_x2: 78.0
variable_purge_len: 40.0
variable_purge_speed: 5.0
variable_retract_len: 2.0
variable_retract_speed: 30.0
# Where the head rests after a print
variable_park_x: 150.0
variable_park_y: 300.0
variable_end_lift: 10.0
variable_cancel_lift: 30.0
variable_pause_lift: 20.0
variable_pause_idle_timeout: 1800
variable_resume_purge_len: 15.0
# Bed mesh: 'adaptive' (built-in or KAMP), 'full', 'load' (profile 'default')
# or 'skip'. Nothing is ever saved to printer.cfg per print.
variable_mesh_mode: 'adaptive'
variable_mesh_margin: 5.0
# The nozzle waits at this temperature while probing so it does not ooze
variable_probing_temp: 140
# Accept the nozzle/bed as "at temperature" this far below the target
variable_hotend_wait_margin: 2.0
variable_bed_wait_margin: 1.0
# Longest wait for the chamber during PRINT_START, minutes
variable_chamber_wait_max_min: 30
# Homing: lift before moving, reduced sensorless currents, clear distances
variable_homing_lift: 7.0
variable_assumed_z_margin: 40.0
variable_home_current: 1.0
variable_home_scale_x: 0.8
variable_home_scale_y: 0.9
variable_home_z_probe_x: 150.0
variable_home_z_probe_y: 150.0
variable_home_z_end: 30.0
# Refuse to print while [probe] z_offset is still the 0 placeholder
variable_require_probe_calibration: True
gcode:

#####################################################################
# Homing
#####################################################################

# Sensorless XY homing at reduced current, then Z on the offset probe.
# Z is homed from an unknown position, so the head is first lifted away from
# the bed, and a probe that is already triggered after the lift is a hard
# error (it is never accepted as a valid Z reference).
[homing_override]
axes: xyz
gcode:
    {% set want_x = 'X' in params %}
    {% set want_y = 'Y' in params %}
    {% set want_z = 'Z' in params %}
    {% set all = not (want_x or want_y or want_z) %}
    {% set xy_homed = 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
    _QD_RESTORE_XY_CURRENT
    _QD_CLEAR_BED
    {% if all %}
        _QD_HOME_XY X=1 Y=1
    {% elif want_z and not xy_homed %}
        _QD_HOME_XY X=1 Y=1
    {% else %}
        {% if want_x or want_y %}
            _QD_HOME_XY X={1 if want_x else 0} Y={1 if want_y else 0}
        {% endif %}
    {% endif %}
    {% if all or want_z %}
        _QD_HOME_Z
    {% endif %}
    G90

[gcode_macro _QD_RESTORE_XY_CURRENT]
description: Put the X/Y driver currents back to the configured run current
gcode:
    {% set rx = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set ry = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={rx}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ry}

[gcode_macro _QD_CLEAR_BED]
description: Lift the head clear of the bed before any homing motion
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        # Z unknown: assume a position with room above it so lifting is legal
        SET_KINEMATIC_POSITION Z={zmax - c.assumed_z_margin} SET_HOMED=z
    {% endif %}
    # Never lift past the axis limit (Z may already be homed near the bottom)
    {% set lift = c.homing_lift %}
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set lift = [lift, zmax - printer.toolhead.position.z]|min %}
    {% endif %}
    {% if lift > 0.05 %}
        G91
        G1 Z{lift} F600
        G90
    {% endif %}
    QUERY_PROBE
    _QD_CLEAR_1

# The three steps below read the probe state AFTER the preceding QUERY_PROBE
# has run (macros render when they are invoked, not when the caller started).
[gcode_macro _QD_CLEAR_1]
gcode:
    {% if printer.probe.last_query %}
        G91
        G1 Z8 F600
        G90
        QUERY_PROBE
        _QD_CLEAR_2
    {% endif %}

[gcode_macro _QD_CLEAR_2]
gcode:
    {% if printer.probe.last_query %}
        G91
        G1 Z8 F600
        G90
        QUERY_PROBE
        _QD_CLEAR_3
    {% endif %}

[gcode_macro _QD_CLEAR_3]
gcode:
    {% if printer.probe.last_query %}
        { action_raise_error("The probe still reads triggered after lifting the head; check for an obstruction or probe wiring. Homing aborted.") }
    {% endif %}

[gcode_macro _QD_HOME_XY]
description: Sensorless X/Y homing at reduced current (X=1 and/or Y=1)
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set hx = params.X|default(1)|int %}
    {% set hy = params.Y|default(1)|int %}
    {% set rx = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set ry = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    M220 S100
    {% if hx and hy and not ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes) %}
        # Nudge off the stops first: homing from a resting stall would trigger
        # immediately. Only relative moves are made in this assumed frame.
        SET_KINEMATIC_POSITION X=0 Y=0 SET_HOMED=xy
        G91
        G1 X5 F2400
        G1 Y5 F2400
        G90
        G4 P500
    {% endif %}
    {% if hx %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={c.home_current * c.home_scale_x}
        G28 X
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={rx}
        BEEP I=1 DUR=100
        G1 X{45 if hy else 10} F1200
    {% endif %}
    {% if hy %}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={c.home_current * c.home_scale_y}
        G28 Y
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ry}
        BEEP I=1 DUR=100
        G1 Y10 F1200
    {% endif %}
    {% if hx and hy %}
        # X again: the Y move can leave the gantry off its X stop
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={c.home_current * c.home_scale_x}
        G28 X
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={rx}
        BEEP I=1 DUR=100
        G1 X10 F1200
    {% endif %}

[gcode_macro _QD_HOME_Z]
description: Home Z on the offset probe at the bed centre
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set px = printer.configfile.settings.probe.x_offset|float %}
    {% set py = printer.configfile.settings.probe.y_offset|float %}
    G90
    G1 X{c.home_z_probe_x - px} Y{c.home_z_probe_y - py} F7800
    G28 Z
    G1 Z{c.home_z_end} F600

[gcode_macro M84]
description: Motors off, except Z: the bed would sink if the Z screws were released
rename_existing: M84.1
gcode:
    M84.1
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1

[delayed_gcode PRINTER_INIT]
initial_duration: 0.2
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=1
    _QD_RESTORE_XY_CURRENT
    BED_MESH_CLEAR
    _QD_SENSORS_OFF

#####################################################################
# Heaters and fans
#####################################################################

# Marlin-style M109/M190: wait only until the target has been reached. Klipper's
# own waits also block until the temperature has settled, so a few degrees of
# overshoot would stall the print start until the heater cooled back down.
[gcode_macro M109]
description: Set hotend temperature and wait until it is reached
rename_existing: M99109
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set s = params.S|default(params.R|default(0))|float %}
    M104 S{s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s - c.hotend_wait_margin}
    {% endif %}

[gcode_macro M190]
description: Set bed temperature and wait until it is reached
rename_existing: M99190
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set s = params.S|default(params.R|default(0))|float %}
    M140 S{s}
    {% if s > 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s - c.bed_wait_margin}
    {% endif %}

# Chamber (M141 sets, M191 sets and waits). Without a chamber heater these
# are accepted and ignored so slicer start code keeps working. With one, the
# request goes through the bed interlock (qd_power_interlock).
[gcode_macro M141]
description: Set chamber temperature (through the bed power interlock)
gcode:
    {% set s = params.S|default(0)|float %}
    {% if printer.qd_power_interlock is defined %}
        QD_SET_CHAMBER TARGET={[s, printer.qd_power_interlock.chamber_max_target]|min}
    {% elif s > 0 %}
        RESPOND MSG="M141: no chamber heater configured, ignored"
    {% endif %}

[gcode_macro M191]
description: Set chamber temperature and wait
gcode:
    {% set s = params.S|default(0)|float %}
    {% if printer.qd_power_interlock is defined %}
        {% if s > 0 %}
            QD_SET_CHAMBER TARGET={[s, printer.qd_power_interlock.chamber_max_target]|min} WAIT=1
        {% else %}
            QD_SET_CHAMBER TARGET=0
        {% endif %}
    {% elif s > 0 %}
        RESPOND MSG="M191: no chamber heater configured, ignored"
    {% endif %}

# P0 (default) part fan, P2 auxiliary fan, P3 chamber circulation fan
[gcode_macro M106]
description: Fan speed: M106 [P0|P2|P3] [S0-255]
gcode:
    {% set p = params.P|default(0)|int %}
    {% set v = params.S|default(255)|float / 255.0 %}
    {% if p == 0 %}
        SET_FAN_SPEED FAN=cooling_fan SPEED={v}
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={v}
    {% elif p == 3 %}
        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={v}
    {% endif %}

[gcode_macro M107]
description: Part fan off
gcode:
    SET_FAN_SPEED FAN=cooling_fan SPEED=0

[gcode_macro BEEP]
description: BEEP [I=<count>] [DUR=<ms>]; only sounds when the sound pin is on
gcode:
    {% set n = params.I|default(1)|int %}
    {% set dur = params.DUR|default(100)|int %}
    {% if printer["output_pin sound"].value|int == 1 %}
        {% for i in range(n) %}
            SET_PIN PIN=beeper VALUE=1
            G4 P{dur}
            SET_PIN PIN=beeper VALUE=0
            G4 P{dur}
        {% endfor %}
    {% endif %}

[gcode_macro beep_on]
gcode:
    SET_PIN PIN=sound VALUE=1

[gcode_macro beep_off]
gcode:
    SET_PIN PIN=sound VALUE=0

# Shake the bed to knock ooze off the nozzle. Not part of the default flow.
[gcode_macro Z_VIBRATE]
description: Vibrate the bed in Z (needs the ctlyd actuator)
gcode:
    SAVE_GCODE_STATE NAME=Z_VIBRATE
    M204 S400
    G90
    G1 Z4 F600
    G91
    SET_PIN PIN=ctlyd VALUE=1
    {% for i in range(1, 50) %}
        G1 Z1 F1200
        G1 Z-1 F1200
    {% endfor %}
    SET_PIN PIN=ctlyd VALUE=0
    G4 P1000
    RESTORE_GCODE_STATE NAME=Z_VIBRATE

[gcode_macro _QD_SENSORS_ON]
gcode:
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
    ENABLE_FILAMENT_WIDTH_SENSOR
    RESET_FILAMENT_WIDTH_SENSOR

[gcode_macro _QD_SENSORS_OFF]
gcode:
    SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
    DISABLE_FILAMENT_WIDTH_SENSOR

[gcode_macro _QD_IDLE_OFF]
description: Idle timeout action: everything off, bed released only via M84
gcode:
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=cooling_fan SPEED=0
    SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    M84

#####################################################################
# Print flow
#####################################################################

# PRINT_START BED=<C> HOTEND=<C> [CHAMBER=<C>] [SOAK=<min>]
#             [MESH=adaptive|full|load|skip]
#
# Order: start the bed while homing, wait for bed (and chamber), heat-soak,
# level (Z_TILT_ADJUST) and re-home Z at temperature, mesh at temperature,
# then bring the nozzle to temperature, purge and go. No SAVE_CONFIG: the mesh
# lives in RAM for the print, so there is no per-print config write or backup.
# SOAK defaults to 0/2/5 min for beds below 60 / 60-89 / 90+ C (2 min with a
# chamber target; the chamber wait itself is bounded by chamber_wait_max_min).
[gcode_macro PRINT_START]
description: PRINT_START BED=<C> HOTEND=<C> [CHAMBER=<C>] [SOAK=<min>] [MESH=adaptive|full|load|skip]
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set bed = params.BED|default(0)|float %}
    {% set hotend = params.HOTEND|default(0)|float %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    {% set mesh = params.MESH|default(c.mesh_mode)|lower %}
    {% set soak = params.SOAK|default(-1)|float %}
    {% if hotend <= 0 %}
        { action_raise_error("PRINT_START: HOTEND=<temperature> is required") }
    {% endif %}
    {% if mesh not in ['adaptive', 'full', 'load', 'skip'] %}
        { action_raise_error("PRINT_START: MESH must be adaptive, full, load or skip") }
    {% endif %}
    {% if c.require_probe_calibration and printer.configfile.settings.probe.z_offset|float == 0.0 %}
        { action_raise_error("PRINT_START: the probe z_offset is still the uncalibrated 0 placeholder. Run PROBE_CALIBRATE, then SAVE_CONFIG (or set variable_require_probe_calibration: False in [gcode_macro _EITRI_CFG] if 0 is really correct).") }
    {% endif %}
    {% if soak < 0 %}
        {% if chamber > 0 %}
            {% set soak = 2 %}
        {% elif bed >= 90 %}
            {% set soak = 5 %}
        {% elif bed >= 60 %}
            {% set soak = 2 %}
        {% else %}
            {% set soak = 0 %}
        {% endif %}
    {% endif %}

    CLEAR_PAUSE
    _QD_RESTORE_XY_CURRENT
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0 MOVE=0
    M220 S100
    M221 S100
    M106 S0
    M106 P2 S0
    M106 P3 S0
    {% if bed > 0 %}
        M140 S{bed}
    {% endif %}
    {% if chamber > 0 %}
        M141 S{chamber}
    {% endif %}
    M104 S{[hotend, c.probing_temp]|min}
    G28
    {% if bed > 0 %}
        M190 S{bed}
    {% endif %}
    {% if chamber > 0 and printer.qd_power_interlock is defined %}
        QD_SET_CHAMBER TARGET={[chamber, printer.qd_power_interlock.chamber_max_target]|min} WAIT=1 TIMEOUT={c.chamber_wait_max_min * 60}
    {% endif %}
    {% if soak > 0 %}
        RESPOND MSG="Heat soak {soak|round(1)} min"
        {% for i in range(soak|int) %}
            G4 P60000
        {% endfor %}
        {% if soak - (soak|int) > 0 %}
            G4 P{((soak - (soak|int)) * 60000)|int}
        {% endif %}
    {% endif %}
    Z_TILT_ADJUST
    G28 Z
    {% if mesh == 'adaptive' %}
        _QD_MESH_ADAPTIVE
    {% elif mesh == 'full' %}
        BED_MESH_CALIBRATE PROFILE=full
    {% elif mesh == 'load' %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}
    QD_LOAD_ZOFFSET
    QD_PURGE HOTEND={hotend}
    _QD_SENSORS_ON
    G90
    G92 E0

[gcode_macro _QD_MESH_ADAPTIVE]
description: Adaptive mesh through KAMP when present, else Klipper's built-in ADAPTIVE=1
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% if printer["gcode_macro _KAMP_Settings"] is defined %}
        BED_MESH_CALIBRATE PROFILE=adaptive
    {% else %}
        BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1 ADAPTIVE_MARGIN={c.mesh_margin}
    {% endif %}

# Heat to HOTEND (default: current target), purge and wipe at the rear chute.
# QD_PURGE [HOTEND=<C>] [LEN=<mm>]
[gcode_macro QD_PURGE]
description: QD_PURGE [HOTEND=<C>] [LEN=<mm>]: purge and wipe at the waste chute
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% set temp = params.HOTEND|default(printer.extruder.target)|float %}
    {% set length = params.LEN|default(c.purge_len)|float %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("QD_PURGE needs the printer homed") }
    {% endif %}
    {% if temp < printer.configfile.settings.extruder.min_extrude_temp|float %}
        { action_raise_error("QD_PURGE: set HOTEND=<temperature> (nozzle is not hot enough to extrude)") }
    {% endif %}
    SAVE_GCODE_STATE NAME=QD_PURGE
    G90
    {% if printer.toolhead.position.z < 35 %}
        G1 Z35 F900
    {% endif %}
    G1 X{c.trash_approach_x} F12000
    G1 Y{c.trash_y - 14} F12000
    G1 Y{c.trash_y} F600
    G1 X{c.trash_x} F600
    M400
    M106 S0
    M109 S{temp}
    M83
    G92 E0
    G1 E{length} F{c.purge_speed * 60}
    G1 E-{c.retract_len} F{c.retract_speed * 60}
    M106 S255
    G4 P3000
    # Wipe the tip across the strip, stepping towards the bed side
    {% for i in range(3) %}
        G1 X{c.wipe_x1} Y{c.trash_y - i * 0.5} F12000
        G1 X{c.wipe_x2} F12000
    {% endfor %}
    G1 X{c.trash_x} F12000
    G1 Y{c.trash_y - 12} F9000
    M106 S0
    M400
    RESTORE_GCODE_STATE NAME=QD_PURGE

[gcode_macro PRINT_END]
description: End of print: retract, lift, park, heaters and fans off
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    M400
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-{c.retract_len} F{c.retract_speed * 60}
    {% endif %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
        G90
        G1 Z{[printer.toolhead.position.z + c.end_lift, printer.toolhead.axis_maximum.z]|min} F900
        G1 X{c.park_x} Y{c.park_y} F9000
    {% endif %}
    M104 S0
    M140 S0
    M141 S0
    M107
    M106 P2 S0
    M220 S100
    M221 S100
    {% if printer.gcode_move.homing_origin.z|abs <= 1.0 %}
        QD_SAVE_ZOFFSET
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    BED_MESH_CLEAR
    _QD_SENSORS_OFF
    CLEAR_PAUSE
    M84
    BEEP I=2 DUR=500

[gcode_macro CANCEL_PRINT]
description: Cancel the print: lift, heaters off, release the file
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
        G90
        G1 Z{[printer.toolhead.position.z + c.cancel_lift, printer.toolhead.axis_maximum.z]|min} F900
        G1 X{c.park_x} Y{c.park_y} F9000
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M106 P2 S0
    M106 P3 S0
    M220 S100
    M221 S100
    {% if printer.gcode_move.homing_origin.z|abs <= 1.0 %}
        QD_SAVE_ZOFFSET
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    BED_MESH_CLEAR
    _QD_SENSORS_OFF
    CLEAR_PAUSE
    M84
    BASE_CANCEL_PRINT
    BEEP I=2 DUR=500

# PAUSE keeps the hotend hot (the idle timeout is lengthened, not disabled) and
# RESUME reheats whatever has cooled in the meantime, primes, returns above the
# print and only then lets Klipper lower the head.
[gcode_macro PAUSE]
description: Pause: retract, lift, park at the waste chute
rename_existing: BASE_PAUSE
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% if printer.pause_resume.is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=btemp VALUE={printer.heater_bed.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=px VALUE={printer.gcode_move.gcode_position.x}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=py VALUE={printer.gcode_move.gcode_position.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=fan VALUE={printer["fan_generic cooling_fan"].speed}
        _QD_SENSORS_OFF
        BASE_PAUSE
        {% if 'xyz' in printer.toolhead.homed_axes %}
            M83
            G1 E-{c.retract_len} F{c.retract_speed * 60}
            G90
            G1 Z{[printer.toolhead.position.z + c.pause_lift, printer.toolhead.axis_maximum.z]|min} F900
            G1 X{c.trash_approach_x} F12000
            G1 Y{c.trash_y - 14} F12000
            G1 Y{c.trash_y} F600
            G1 X{c.trash_x} F600
        {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT={c.pause_idle_timeout}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    {% endif %}

[gcode_macro RESUME]
description: Resume after a pause
rename_existing: BASE_RESUME
variable_etemp: 0
variable_btemp: 0
variable_px: 0
variable_py: 0
variable_fan: 0
gcode:
    {% set c = printer["gcode_macro _EITRI_CFG"] %}
    {% if printer.pause_resume.is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if btemp > 0 %}
            M190 S{btemp}
        {% endif %}
        {% if etemp > 0 %}
            M109 S{etemp}
            QD_PURGE HOTEND={etemp} LEN={c.resume_purge_len}
        {% endif %}
        G90
        G1 X{px} Y{py} F9000
        SET_FAN_SPEED FAN=cooling_fan SPEED={fan}
        _QD_SENSORS_ON
        BASE_RESUME
    {% endif %}

# Marlin-flavoured codes that slicers and displays send
[gcode_macro M900]
description: Marlin linear advance K -> pressure advance
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K|float}
    {% endif %}
    {% if params.T is defined %}
        SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T|float}
    {% endif %}

[gcode_macro M290]
description: Baby-step the Z offset: M290 Z<mm>
gcode:
    SET_GCODE_OFFSET Z_ADJUST={params.Z|default(0)|float} MOVE=1

[gcode_macro M0]
gcode:
    PAUSE

[gcode_macro M600]
description: Filament change: pause
gcode:
    PAUSE

#####################################################################
# Filament load/unload (the screen and slicers send M603/M604)
#####################################################################

[gcode_macro M603]
description: Unload filament: M603 [S<hotend C>]
gcode:
    {% set temp = params.S|default(250)|float %}
    _QD_ENSURE_HOMED
    QD_PURGE HOTEND={temp} LEN=5
    M83
    G1 E-50 F600
    M104 S0
    M400

[gcode_macro M604]
description: Load filament: M604 [S<hotend C>]
gcode:
    {% set temp = params.S|default(250)|float %}
    _QD_ENSURE_HOMED
    QD_PURGE HOTEND={temp} LEN=60
    M400
    M104 S0

[gcode_macro _QD_ENSURE_HOMED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

#####################################################################
# Calibration entry points used by displays
#####################################################################

[gcode_macro M4027]
description: Full bed mesh (profile 'default'); saves it with SAVE_CONFIG
gcode:
    G28
    BED_MESH_CALIBRATE PROFILE=default
    G1 Z50 F600
    G1 X0 Y0 F9000
    M400
    RESPOND MSG="Bed mesh calibration complete"
    SAVE_CONFIG

[gcode_macro M4028]
description: Home and apply the saved Z offset
gcode:
    G28
    QD_LOAD_ZOFFSET
    M400
    RESPOND MSG="Position init complete"

[gcode_macro M4031]
description: Sensorless Z reverse homing (not available yet)
gcode:
    { action_raise_error("M4031 (sensorless Z reverse homing) is not implemented yet; see extras/qd_reverse_home.py. Use Z_TILT_ADJUST for bed squaring.") }

#####################################################################
# Power-loss recovery prompt
#####################################################################

[delayed_gcode QD_PLR_DETECT]
initial_duration: 8
gcode:
    {% if printer.qd_plr is defined and printer.qd_plr.recovery_available %}
        RESPOND MSG="Interrupted print detected: {printer.qd_plr.file}"
        RESPOND TYPE=command MSG="action:prompt_begin Interrupted print"
        RESPOND TYPE=command MSG="action:prompt_text {printer.qd_plr.file} was interrupted."
        RESPOND TYPE=command MSG="action:prompt_text Resuming trusts the saved Z height: make sure the bed did not move and the nozzle is clear of the part."
        RESPOND TYPE=command MSG="action:prompt_footer_button Discard|QD_PLR_CLEAR|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Resume|QD_PLR_RESUME CONFIRM=1|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

# Settings that exist only on Kalico (linked as eitri-flavor.cfg by
# scripts/overlay-install.sh when the clone is Kalico).

[danger_options]
# Multi-MCU homing sync timeout (probe on the toolhead MCU, Z on the
# mainboard MCU). 0.1 s is the value QIDI's firmware ships; lower it back
# towards 0.025 once homing is proven reliable on your unit.
multi_mcu_trsync_timeout: 0.1
# Typos in option names stay errors (this is also Kalico's default).
error_on_unused_config_options: True

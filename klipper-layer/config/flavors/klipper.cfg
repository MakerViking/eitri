# Settings that exist only on mainline Klipper (linked as eitri-flavor.cfg by
# scripts/overlay-install.sh when the clone is mainline Klipper).

# Multi-MCU homing sync timeout (probe on the toolhead MCU, Z on the
# mainboard MCU). 0.1 s is the value QIDI's firmware ships; lower it back
# towards Klipper's 0.025 once homing is proven reliable on your unit.
[qd_runtime_patches]
trsync_timeout: 0.1

# The filament sensor is used for presence only; never let it scale extrusion.
[hall_filament_width_sensor]
enable_flow_compensation: False

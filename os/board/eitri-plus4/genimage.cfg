// genimage configuration for the Eitri OS disk image.
//
// Raw layout, in 512-byte sectors (Rockchip fixes the first two offsets):
//
//   sector      0..33   GPT (primary header and entries)
//   sector     64       idbloader.img  (SPL + TPL, written at 32 KiB)
//   sector   8128       A/B boot state, one sector (not in the image; U-Boot
//                       and rauc-bootloader own it)
//   sector  16384       u-boot.itb     (U-Boot proper + BL31, written at 8 MiB)
//   16 MiB              boot      FAT   eitri-boot.env, mounted at /boot/firmware
//   48 MiB              rootfs-a  ext4  read-only; kernel and DTB in /boot
//   816 MiB             rootfs-b  ext4  read-only; empty in a fresh image
//   1584 MiB            data      ext4  writable; grown to fill the eMMC on first boot
//
// The image is flashed to the start of the eMMC. Its backup GPT therefore does
// not sit at the end of the device; the first boot moves it and enlarges the
// data partition (eitri-grow-data.service). All GUIDs are fixed so that the
// same inputs always produce the same image.

image boot.vfat {
	vfat {
		label = "EITRIBOOT"
		files = {
			"eitri-boot.env",
			"README.txt"
		}
	}
	size = 32M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
		// Fixed ids keep the file system byte-identical between builds apart
		// from the creation time.
		extraargs = "-m 1 -e remount-ro -U 7b1f9f0e-3a5c-4f6e-9c41-0e17a1d20004 -E hash_seed=7b1f9f0e-3a5c-4f6e-9c41-0e17a1d30004"
	}
	size = 128M
}

image eitri-plus4.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "7b1f9f0e-3a5c-4f6e-9c41-0e17a1d00001"
		align = 4M
	}

	partition idbloader {
		in-partition-table = "no"
		image = "idbloader.img"
		offset = 32K
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot.itb"
		offset = 8M
	}

	partition boot {
		partition-type-uuid = F
		partition-uuid = "7b1f9f0e-3a5c-4f6e-9c41-0e17a1d10001"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs-a {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = "7b1f9f0e-3a5c-4f6e-9c41-0e17a1d10002"
		image = "rootfs.ext4"
		size = 768M
	}

	partition rootfs-b {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = "7b1f9f0e-3a5c-4f6e-9c41-0e17a1d10003"
		size = 768M
	}

	partition data {
		partition-type-uuid = L
		partition-uuid = "7b1f9f0e-3a5c-4f6e-9c41-0e17a1d10004"
		image = "data.ext4"
	}
}

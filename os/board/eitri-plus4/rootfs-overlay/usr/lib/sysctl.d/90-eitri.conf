# zram swap is cheap, so prefer it over dropping the page cache.
vm.swappiness = 100
vm.page-cluster = 0
# Reboot after a kernel panic; the A/B counters then pick the slot.
kernel.panic = 10
# The printer can be on the same network twice, by cable (eth0) and by Wi-Fi (wlan0). Linux answers an
# ARP request for any of its addresses on every interface by default ("ARP flux"), so the Wi-Fi adapter
# answered for the cable's address: NetworkManager saw a conflict on every lease renewal, the local route
# went to wlan0 only, and the cable address dropped off whenever the weak Wi-Fi did (2026-10-24, the
# printer "offline" with a good cable). Answer only on the interface that owns the address, and announce
# from it.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2

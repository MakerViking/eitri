[Journal]
# Keep the journal across reboots and crashes, so a host that hangs leaves a readable log.
# /var is a tmpfs on this board, so the store lives on /data: tmpfiles.d/eitri-journal.conf
# links /var/log/journal there and eitri-journal.service flushes the journal into it.
# This must be the only Storage= setting: drop-ins are read in file-name order and the last
# one wins (a separate 10-eitri-persist.conf lost to this file's earlier Storage=volatile,
# and the 2026-10-24 lockup left no log). os/tests/test_tree.py checks the effective value.
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
RuntimeMaxUse=24M
# Write to the eMMC every 30 s instead of every 5 min, so the minute before a hang is on
# disk (journald also syncs at once for critical messages). Klipper and Moonraker keep
# their own rotated logs under /data/printer_data/logs.
SyncIntervalSec=30s
ForwardToSyslog=no

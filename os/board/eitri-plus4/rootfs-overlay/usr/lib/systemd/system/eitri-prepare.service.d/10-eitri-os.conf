# Added by the OS image to the eitri-update unit.
#
# eitri-prepare starts from /data/eitri and writes /data/eitri/logs, both created by eitri-data-init. The unit
# has no default dependencies and only waits for the mount, so on the first boot it could run before
# the layout exists, find /data/eitri missing and skip the first-boot MCU flash.
#
# It also has to see the data seed: the MCU firmware it matches to this host is the one that belongs to
# the seed's Klipper commit, and an image that unpacks its seed on the first boot does that in eitri-seed.
[Unit]
Wants=eitri-data-init.service eitri-seed.service
After=eitri-data-init.service eitri-seed.service

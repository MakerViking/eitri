# Resource policy of the OS image for a service that belongs to another component.
#
# MemoryHigh is a soft limit: above it the kernel reclaims from this service and slows it down, so a
# leak shows up as a sluggish service rather than an OOM kill of something important. It is
# deliberately not MemoryMax, and klipper.service has no limit at all.
[Service]
MemoryHigh=128M

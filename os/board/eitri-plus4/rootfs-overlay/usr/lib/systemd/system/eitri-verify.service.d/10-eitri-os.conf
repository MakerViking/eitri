# Added by the OS image to the eitri-update unit.
#
# eitri-verify is the one place a slot is committed. Before it looks at Klipper and Moonraker it
# requires the OS itself to be healthy (D-Bus, NetworkManager, sshd, nginx, the configurator, /data),
# which is what eitri-mark-good used to decide on its own. If this gate fails the unit fails, the
# slot stays uncommitted and U-Boot counts down to the previous system.
[Unit]
After=rauc.service eitri-data-init.service
Wants=rauc.service

[Service]
ExecStartPre=/usr/libexec/eitri/mark-good --check

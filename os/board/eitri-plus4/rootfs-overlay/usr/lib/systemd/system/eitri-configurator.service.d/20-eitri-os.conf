# Added by the OS image to the configurator's unit (configurator/systemd/eitri-configurator.service).
#
# 1. Decision 8: the configurator exits once setup is complete and it is locked (--retire-when-locked),
#    which frees about 30 MiB. Klarity's "Unlock setup" button runs `sudo eitri-configurator unlock` and
#    starts the unit again. Restart=on-failure leaves a clean exit alone. Keep this command line equal to
#    the unit's own ExecStart plus the flag (os/tests/test_tree.py compares them).
# 2. The optional root-access step calls `sudo -n /usr/libexec/eitri/eitri-access`. sudo is setuid, so the
#    unit cannot have NoNewPrivileges, and (measured with systemd 258) it cannot use any seccomp-based sandbox
#    option either, because systemd then sets NoNewPrivs anyway. The component unit already leaves those out;
#    this repeats NoNewPrivileges=false for the case that someone adds them back. The only thing the sudoers
#    rules allow the account is that helper (fixed command lines, input validated by the tool), the update tools
#    and `eitri-configurator unlock`.
[Service]
ExecStart=
ExecStart=/data/eitri/configurator/venv/bin/python -m eitri_configurator --host 0.0.0.0 --port 8099 --retire-when-locked
NoNewPrivileges=false

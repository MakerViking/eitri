# Masks systemd's /usr/lib/tmpfiles.d/journal-nocow.conf (same file name in /etc wins).
#
# Its only rules set the NOCOW attribute (+C) on /var/log/journal, which matters on btrfs alone; Eitri's
# /data is ext4. eitri-journal.conf makes /var/log/journal a symlink to /data, and an attribute cannot be set
# on a symlink: Buildroot's build-time systemd-tmpfiles (fakeroot_tmpfiles.sh, forced on by the /var factory)
# then exits 73 and the rootfs image is not written.

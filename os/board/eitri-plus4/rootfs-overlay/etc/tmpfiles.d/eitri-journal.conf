# Persistent journal on /data (/var is tmpfs). The symlink is recreated each boot by
# systemd-tmpfiles-setup; eitri-journal.service then flushes the journal into it
# (systemd-journal-flush runs too early to see it), so a crash leaves a readable log.
d /data/eitri/state/log 2755 root root - -
d /data/eitri/state/log/journal 2755 root systemd-journal - -
L+ /var/log/journal - - - - /data/eitri/state/log/journal

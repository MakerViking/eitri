# Persistent journal on /data (/var is tmpfs). The symlink is recreated each boot
# before systemd-journal-flush, so the shutdown that follows is captured.
d /data/eitri/state/log 2755 root root - -
d /data/eitri/state/log/journal 2755 root systemd-journal - -
L+ /var/log/journal - - - - /data/eitri/state/log/journal

# Included by the server block in nginx.conf: only the local network may use the web interface.
# The Eitri web server has no login; do not expose it to the internet.
#
# IPv4: loopback, private and link-local ranges (this is where port forwarding and UPnP expose a
# device, and a router's NAT hides everything else).
allow 127.0.0.0/8;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 169.254.0.0/16;
# There is no IPv6 rule on purpose: nginx.conf has no IPv6 listener, so IPv6 clients are never served.
# A rule cannot tell a home network's global IPv6 addresses from the internet's; widening this file to
# IPv6 means adding a listener in nginx.conf and a real allow-list here.
deny all;

# Included by the server block in nginx.conf: only the local network may use the web interface.
# The Eitri web server has no login; do not expose it to the internet.
#
# IPv4: loopback, private and link-local ranges (this is where port forwarding and UPnP expose a
# device, and a router's NAT hides everything else).
allow 127.0.0.0/8;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 169.254.0.0/16;
# IPv6: a home network's devices usually reach each other on global addresses (mDNS announces them),
# and a rule cannot tell those from the internet, so IPv6 is not restricted here. The router's
# IPv6 firewall must keep unsolicited inbound connections blocked, which is the default.
allow ::/0;
deny all;

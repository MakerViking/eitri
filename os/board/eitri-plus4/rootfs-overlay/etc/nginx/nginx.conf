# nginx for Eitri: serves the active web UI on port 80 and proxies Moonraker,
# the configurator and the camera. All logging goes to the journal.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    # Requests are small everywhere except the G-code upload locations below; a client must not be
    # able to fill /data through any other route.
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream moonraker {
        server 127.0.0.1:7125;
        keepalive 4;
    }

    upstream configurator {
        server 127.0.0.1:8099;
        keepalive 2;
    }

    server {
        # IPv4 only (decision 7): the allow-list below cannot tell a home network's IPv6 addresses from the
        # internet's, so there is deliberately no IPv6 listener.
        listen 0.0.0.0:80 default_server;
        server_name _;

        # Local network only: loopback, private and link-local addresses. There is no login on this
        # server; port forwarding it to the internet is not supported. Edit the file to widen it.
        include /etc/nginx/eitri-lan-only.conf;

        # /data/eitri/ui/current is a symlink to /usr/share/eitri/ui/fluidd or .../mainsail.
        root /data/eitri/ui/current;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 86400;
        }

        # G-code uploads (Moonraker's own API and its OctoPrint-compatible one) are the only requests
        # that may be large.
        location ~ ^/(server/files/upload|api/files/(local|sdcard))$ {
            client_max_body_size 1g;
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 600;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 600;
        }

        # The configurator uses relative URLs, so it works under this prefix.
        location = /configure {
            return 301 /configure/;
        }

        location /configure/ {
            proxy_pass http://configurator/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Server-sent events carry the progress of long jobs.
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # /webcam/ for the camera (ustreamer on 127.0.0.1:8080), installed by
        # the camera package.
        include /etc/nginx/eitri/*.inc;
    }
}

# nginx for Eitri: serves the active web UI on port 80 and proxies Moonraker
# and the camera. All logging goes to the journal. The setup wizard is NOT
# served here: it has its own origin on port 8099, so nothing on port 80 can
# read its session or its CSRF token.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    # Requests are small everywhere except the G-code upload locations below; a client must not be
    # able to fill /data through any other route.
    client_max_body_size 1m;

    # Exact names need hash buckets that hold the longest one (DNS allows 253 characters); the default (32 on
    # some CPUs) makes nginx refuse the whole configuration as soon as eitri-hosts.map has a name in it.
    # It must come before the first map block.
    map_hash_bucket_size 512;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Who may talk to the printer through this server --------------------------------------------
    # "Trust my home network" trusts devices by address, which a web page in a LAN browser can borrow:
    # by naming a domain it controls that resolves to the printer (DNS rebinding), or by sending a form
    # straight to it (a cross-site request). Two checks close that without touching the clients that
    # matter, because slicers, phone apps and Home Assistant send neither a foreign Host nor the
    # browser-only Origin / Sec-Fetch-Site headers.
    #
    # 1. The Host header must be a name the printer can legitimately be reached by. Extra names (a router
    #    DNS name such as printer.home.arpa) go in /data/printer_data/config/eitri-hosts.txt;
    #    eitri-hosts.service validates them and writes eitri-hosts.map.
    map $host $eitri_host_known {
        default                                         0;
        localhost                                       1;
        "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$"                 1;   # an IPv4 address
        "~^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"               1;   # a single-label name: eitri, printer
        "~^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+local$"     1;   # mDNS: eitri.local
        include /etc/nginx/eitri-hosts.map;
    }
    # 2. A request a browser marks as coming from another site, or from a page of another origin, is
    #    refused on the Moonraker routes (the API and its websocket). The camera stays open so that a
    #    dashboard on another host (Home Assistant) can still show the stream.
    map $http_sec_fetch_site $eitri_fetch_foreign {
        default     0;
        cross-site  1;
        same-site   1;
    }
    map "$http_origin $scheme://$http_host" $eitri_origin_foreign {
        default         1;   # another origin, or "null"
        "~^ "           0;   # no Origin header: not a browser page
        "~^(\S+) \1$"   0;   # the page came from this printer
    }
    map "$eitri_fetch_foreign$eitri_origin_foreign" $eitri_cross_site {
        default 1;
        "00"    0;
    }

    upstream moonraker {
        server 127.0.0.1:7125;
        keepalive 4;
    }


    server {
        # IPv4 only (decision 7): the allow-list below cannot tell a home network's IPv6 addresses from the
        # internet's, so there is deliberately no IPv6 listener.
        listen 0.0.0.0:80 default_server;
        server_name _;

        # Local network only: loopback, private and link-local addresses. There is no login on this
        # server; port forwarding it to the internet is not supported. Edit the file to widen it.
        include /etc/nginx/eitri-lan-only.conf;

        if ($eitri_host_known = 0) {
            rewrite ^ /eitri-unknown-host last;
        }
        location = /eitri-unknown-host {
            internal;
            default_type text/plain;
            add_header X-Content-Type-Options nosniff always;
            return 403 "This printer does not answer to the name \"$host\". Use its IP address or eitri.local, or add the name on its own line to eitri-hosts.txt in the printer's configuration files.\n";
        }
        location = /eitri-cross-site {
            internal;
            default_type text/plain;
            add_header X-Content-Type-Options nosniff always;
            return 403 "Refused: this request came from a page on another site. Open the printer's own web interface instead.\n";
        }

        # /data/eitri/ui/current is a symlink to /usr/share/eitri/ui/fluidd or .../mainsail.
        root /data/eitri/ui/current;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            if ($eitri_cross_site) {
                rewrite ^ /eitri-cross-site last;
            }
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 86400;
        }

        # G-code uploads (Moonraker's own API and its OctoPrint-compatible one) are the only requests
        # that may be large.
        location ~ ^/(server/files/upload|api/files/(local|sdcard))$ {
            if ($eitri_cross_site) {
                rewrite ^ /eitri-cross-site last;
            }
            client_max_body_size 1g;
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 600;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            if ($eitri_cross_site) {
                rewrite ^ /eitri-cross-site last;
            }
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 600;
        }


        # /webcam/ for the camera (ustreamer on 127.0.0.1:8080), installed by
        # the camera package.
        include /etc/nginx/eitri/*.inc;
    }
}

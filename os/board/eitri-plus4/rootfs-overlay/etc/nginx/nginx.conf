# nginx for Eitri: serves the active web UI on port 80 and proxies Moonraker,
# the configurator and the camera. All logging goes to the journal.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    # G-code files are uploaded through this server.
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream moonraker {
        server 127.0.0.1:7125;
        keepalive 4;
    }

    upstream configurator {
        server 127.0.0.1:8099;
        keepalive 2;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # /data/eitri/ui is a symlink to /usr/share/eitri/ui/fluidd or .../mainsail.
        root /data/eitri/ui;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 600;
        }

        # The configurator uses relative URLs, so it works under this prefix.
        location = /configure {
            return 301 /configure/;
        }

        location /configure/ {
            proxy_pass http://configurator/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Server-sent events carry the progress of long jobs.
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # /webcam/ for the camera (ustreamer on 127.0.0.1:8080), installed by
        # the camera package.
        include /etc/nginx/eitri/*.inc;
    }
}

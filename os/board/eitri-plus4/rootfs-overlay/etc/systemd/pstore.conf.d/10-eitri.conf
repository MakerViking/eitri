# Kernel crash records the previous boot left in ramoops (dts: reserved-memory ramoops) go
# into the journal, which is kept on /data (eitri-journal.service). The default, external,
# writes them to /var/lib/systemd/pstore, a tmpfs here, so they would be lost again.
# Read them with: journalctl -b -1 -t systemd-pstore
[PStore]
Storage=journal
Unlink=yes

# Hardware watchdog (the RK3328's dw_wdt, /dev/watchdog). systemd pets it; if the whole
# system freezes (a hard lockup: the screen keeps its last picture, the network and SSH
# are gone, Klipper's MCUs have already shut their heaters off), the watchdog resets the
# SoC instead of leaving it hung until someone pulls the power. A minute is far longer than
# any legitimate stall. RebootWatchdogSec covers a reboot or shutdown that hangs.
# Bench-validate: whether this reset brings the board back through the stock boot firmware
# is not yet verified (see the syscon-reboot note in dts/rk3328-eitri-plus4.dts).
[Manager]
RuntimeWatchdogSec=1min
RebootWatchdogSec=2min

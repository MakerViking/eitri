# RAUC system configuration, installed as /etc/rauc/system.conf.
#
# Slots are addressed by Linux device node, not by PARTLABEL: a bench microSD
# card carries the same labels as the eMMC, and the device-tree aliases fix the
# eMMC at mmcblk1 (see rk3328-eitri-plus4.dts and docs/boot-chain.md). These
# slots describe the flash-once GPT eMMC only. The in-place conversion and the
# bench microSD image (os/bench/) replace them through the /etc overlay
# (/data/eitri/state/etc/upper/rauc/system.conf), and rauc-pre-install refuses
# any slot that is not on the disk the running system booted from.

[system]
compatible=eitri-plus4
bootloader=custom
mountprefix=/run/rauc
statusfile=/data/eitri/state/rauc.status
# Only signed, dm-verity protected bundles are accepted.
bundle-formats=-plain

[handlers]
# U-Boot keeps the A/B state in one raw eMMC sector, see uboot.env.
bootloader-custom-backend=/usr/libexec/eitri/rauc-bootloader
# Refuses any target slot that is not on the disk holding the running root file
# system, so a system started from a microSD card can never write the eMMC (and
# a missing in-place override can never write over the stock partitions).
pre-install=/usr/libexec/eitri/rauc-pre-install

[keyring]
path=/etc/rauc/keyring.pem
# Bundles are signed with a code-signing certificate (extendedKeyUsage
# codeSigning). Without this line OpenSSL would demand an S/MIME signing one.
check-purpose=codesign
# The printer has no battery-backed clock, so certificate validity is judged at
# the time the bundle was signed, not at the (possibly 1970) current time.
use-bundle-signing-time=true

[streaming]
# Streaming installs run unprivileged; "nobody" exists in every image, the
# default "rauc-nobody" does not.
sandbox-user=nobody

[slot.rootfs.0]
device=/dev/mmcblk1p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk1p3
type=ext4
bootname=B

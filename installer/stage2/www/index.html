<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eitri - installing</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ee; --panel: #ffffff; --ink: #1b1a18; --muted: #6d675e; --line: #e3ddd2;
    --accent: #2f6fa8; --accent-soft: #d6e4f1; --ok: #2f7d4f; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14130f; --panel: #1d1b17; --ink: #f0ece4; --muted: #a39b8d; --line: #2e2b25; --accent: #6fa8dc; --accent-soft: #1c2a38; --ok: #5fc388; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 32px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: #fff;
          font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; }
  .bar { height: 10px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin: 24px 0 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .6s ease; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  #step { font-weight: 600; } #pct { color: var(--muted); }
  #msg { margin: 8px 0 0; color: var(--muted); min-height: 3em; overflow-wrap: anywhere; }
  .state-done .bar > i { background: var(--ok); } .state-done #step { color: var(--ok); }
  .state-failed .bar > i { background: var(--bad); } .state-failed #step { color: var(--bad); }
  .warn { margin-top: 20px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main id="app" class="state-running" aria-live="polite">
  <div class="brand"><div class="mark" aria-hidden="true">E</div><div><h1>Eitri installer</h1><div class="sub">Converting your X-Plus 4 - this page updates itself</div></div></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
  <div class="row"><span id="step">Starting</span><span id="pct">0%</span></div>
  <p id="msg">Waiting for the installer.</p>
  <div class="warn" id="warn">Do not switch the printer off. It restarts by itself when the installation is finished.</div>
</main>
<script>
(function () {
  var app = document.getElementById('app'), fill = document.getElementById('fill'), bar = document.querySelector('.bar');
  var step = document.getElementById('step'), pct = document.getElementById('pct'), msg = document.getElementById('msg'), warn = document.getElementById('warn');
  var names = { init: 'Starting', verify: 'Checking files', check: 'Checking the stock system', shrink: 'Making room',
                partition: 'Creating partitions', rootfs: 'Writing the system', 'verify-rootfs': 'Verifying the write', data: 'Preparing /data',
                commit: 'Switching over', done: 'Done', failed: 'Stopped', restore: 'Restoring' };
  function tick() {
    fetch('status.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      app.className = 'state-' + s.state;
      fill.style.width = s.pct + '%'; bar.setAttribute('aria-valuenow', s.pct);
      step.textContent = names[s.step] || s.step; pct.textContent = s.pct + '%'; msg.textContent = s.msg;
      if (s.state === 'failed') warn.textContent = 'Nothing is lost: the printer will restart into its original system. Details are saved on the printer in /boot/eitri/LAST_ERROR.';
      if (s.state === 'done') warn.textContent = 'Finished. Open the printer address again in a minute to continue with Eitri.';
    }).catch(function () { msg.textContent = 'The printer is restarting - reconnecting...'; });
  }
  tick(); setInterval(tick, 2000);
})();
</script>
</body>
</html>

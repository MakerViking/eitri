# Moonraker [webcam] entry for the Eitri camera. Append to moonraker.conf, or
# include it from there. Relative URLs are served through nginx /webcam/, which
# proxies to ustreamer on 127.0.0.1:8080 (see nginx-webcam.inc).
#
# service "mjpegstreamer" matches ustreamer's MJPEG/HTTP output, which
# Mainsail and Fluidd both play natively. Do not switch to a webrtc-* service:
# the camera is MJPEG and WebRTC cannot carry it without transcoding.
#
# Klarity (when its camera preview is enabled) fetches ustreamer's /snapshot directly on 127.0.0.1:8080.

[webcam eitri]
location: printer
service: mjpegstreamer
enabled: True
target_fps: 30
stream_url: /webcam/stream
snapshot_url: /webcam/snapshot

name: ci

# Hardware-free checks, the same suites `make test` runs locally:
#   checks          syntax gate, repository checks, release tooling, Klarity, the configurator, the OS tree, the MCU
#                   tooling, the camera, the installer and the data seed's offline tests. Tests that need an artifact
#                   this job does not build (a U-Boot sandbox, built seeds or MCU bundles, go2rtc) skip with a reason.
#   klipper-layer   the qd_* extras against the Klipper and Kalico commits pinned in release.lock, including the real
#                   klippy in batch mode (needs each tree's MCU data dictionary, built here with the pinned toolchain).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, repository checks and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nodejs minisign zstd openssl ffmpeg e2fsprogs
          python -m pip install --quiet pytest pytest-asyncio ruff aiohttp pyyaml websockets pyserial-asyncio-fast pillow cryptography
          python -m pip install --quiet -e klarity

      - name: Syntax gate and repository checks
        run: make test-repo

      # The signing step of the release workflow, tested with real minisign and a stand-in for rauc (the pinned rauc is
      # only built in the release job; the real-rauc tests skip here).
      - name: Release tooling
        run: python -m pytest tools/tests -q -p no:cacheprovider

      - name: Klarity
        run: |
          make test-klarity
          ruff check klarity/src klarity/tests

      - name: Configurator
        run: make test-configurator

      - name: OS tree (pins, scripts, units)
        run: make test-os

      - name: MCU tooling
        run: make test-mcu

      - name: Camera
        run: make test-camera

      - name: Installer (scripts, mcuflash, eitri-update)
        run: make test-installer

      - name: Data seed (offline tests)
        run: make test-seed

  klipper-layer:
    name: klipper-layer against the pinned Klipper and Kalico
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # klippy's own runtime dependencies (cffi, greenlet, jinja2, pyserial, python-can, numpy, msgspec) plus pytest.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make xz-utils curl
          python -m pip install --quiet pytest cffi greenlet jinja2 pyserial python-can numpy msgspec

      # Full clones: the tests make throw-away --shared clones of these and read `git describe`, so tags and every
      # blob of the pinned commit must be local.
      - name: Pinned Klipper and Kalico trees
        run: |
          for flavor in klipper kalico; do
            url=$(python -I mcu/mcutool.py lock "firmware.$flavor" source)
            commit=$(python -I mcu/mcutool.py lock "firmware.$flavor" commit)
            git clone -q "$url" "$RUNNER_TEMP/$flavor"
            git -C "$RUNNER_TEMP/$flavor" checkout -q --detach "$commit"
          done

      - name: Toolchain
        run: mcu/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"

      - name: klippy data dictionaries
        run: |
          PATH="$RUNNER_TEMP/toolchain/bin:$PATH" \
            klipper-layer/tests/build-dicts.sh "$RUNNER_TEMP/dicts" "$RUNNER_TEMP/klipper" "$RUNNER_TEMP/kalico"

      - name: klipper-layer tests (real klippy in batch mode)
        env:
          EITRI_KLIPPER_SRC: ${{ runner.temp }}/klipper
          EITRI_KALICO_SRC: ${{ runner.temp }}/kalico
          EITRI_KLIPPY_DICTS: ${{ runner.temp }}/dicts
        run: cd klipper-layer && python -B -m pytest -q -p no:cacheprovider

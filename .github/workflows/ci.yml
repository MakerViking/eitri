name: ci

# Fast, hardware-free checks for every component that does not need a Buildroot build or an upstream
# Klipper checkout: syntax gate, repository checks, Klarity, the configurator (against the real
# eitri-mcuflash CLI and the klipper-layer templates) and the OS tree's unit tests.
# Not run here yet: the klipper-layer tests (need Klipper/Kalico checkouts and arm-none-eabi-gcc, see
# klipper-layer/tests/conftest.py), the camera tests (need go2rtc and ffmpeg) and the installer suite
# (needs a U-Boot sandbox build for its boot-script tests). `make test` runs all of them locally.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, repository checks and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nodejs minisign zstd openssl
          python -m pip install --quiet pytest ruff aiohttp pyyaml websockets pyserial-asyncio-fast pillow
          python -m pip install --quiet -e klarity

      - name: Syntax gate and repository checks
        run: make test-repo

      # The signing step of the release workflow, tested with real minisign and a stand-in for rauc (the pinned rauc is
      # only built in the release job; the real-rauc tests skip here).
      - name: Release tooling
        run: python -m pytest tools/tests -q -p no:cacheprovider

      - name: Klarity
        run: |
          make test-klarity
          ruff check klarity/src klarity/tests

      - name: Configurator
        run: make test-configurator

      - name: OS tree (pins, scripts, units)
        run: make test-os

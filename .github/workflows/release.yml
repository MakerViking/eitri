name: release

# Signs an Eitri release. Nothing in the build workflows (os-image, data-seed) holds a signing key: they produce
# unsigned artifacts. This workflow collects them, waits for Thomas to approve, signs, and attaches the result to the
# draft release. docs/RELEASING.md explains the keys, the environment settings and the offline fallback.
#
#   git tag -s v2026.10.0 && git push origin v2026.10.0       # starts os-image and data-seed (and legal)
#   gh workflow run release.yml --ref v2026.10.0              # when all of them are green
#
# collect  no secrets. Finds the successful build runs of this tag's commit, downloads their artifacts, checks their
#          digests, runs the preflight and pins every file in INPUTS.sha256. The job summary lists what will be signed.
# sign     the "release" environment (required reviewer, tag-restricted). The only job with secrets, and only its signing
#          step reads them. It re-verifies INPUTS.sha256 against the digest collect reported, builds the pinned RAUC,
#          re-signs the RAUC bundle, writes install.json / manifest.json, signs them and SHA256SUMS with minisign, and
#          verifies the result with the printer's own code. Keys exist on disk only inside that step.
# publish  no secrets. Verifies the signed set again (public keys only) and uploads it to the DRAFT release. Publishing
#          the release stays a manual step.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect the unsigned build outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      generated: ${{ steps.tag.outputs.generated }}
      inputs_sha256: ${{ steps.pin.outputs.inputs_sha256 }}
    steps:
      - name: Require a release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::run this workflow on a release tag: gh workflow run release.yml --ref vYYYY.MM.N"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vYYYY.MM.N"
            exit 1
          fi
          {
            echo "version=$version"
            echo "generated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      # The artifacts must come from the runs for exactly this tag's commit; a green run for a branch with the same
      # name or for an older commit is not accepted.
      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          for wf in os-image.yml data-seed.yml; do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --event push --commit "$GITHUB_SHA" --status success \
                   --limit 20 --json databaseId,headBranch,headSha \
                   --jq "[.[] | select(.headBranch == \"$GITHUB_REF_NAME\" and .headSha == \"$GITHUB_SHA\")][0].databaseId // empty")
            if [ -z "$id" ]; then
              echo "::error::no successful $wf run for $GITHUB_REF_NAME at $GITHUB_SHA; push the tag and wait for the build"
              exit 1
            fi
            echo "$wf: run $id ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id)" | tee -a runs.txt
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "dl/${wf%.yml}"
          done
          find dl -type f | sort

      - name: Assemble the unsigned set
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir unsigned
          # every build artifact carries its own SHA256SUMS: the files must still match what the build job wrote
          while IFS= read -r sums; do
            (cd "$(dirname "$sums")" && sha256sum --check --strict "$(basename "$sums")")
          done < <(find dl -type f -name 'SHA256SUMS*' | sort)
          # gh puts each artifact into a directory of its own; find the files rather than assume the layout, and
          # insist on exactly one match so a stray duplicate cannot be picked silently.
          # $2: where to look (default: everything). The seeds come from the data-seed run only: the os-image run carries a
          # copy of the klipper seed as well (it built the image from it), which must not count as a second candidate.
          pick() {
            local found
            found=$(find "${2:-dl}" -type f -name "$1" | sort)
            if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
              echo "::error::expected exactly one $1 in the build artifacts, found: ${found:-none}"
              exit 1
            fi
            cp -- "$found" unsigned/
          }
          pick "eitri-plus4-$VERSION.img.zst"
          pick "eitri-plus4-$VERSION.raucb"
          pick buildroot.config
          for flavor in klipper kalico; do
            pick "data-seed-$VERSION-$flavor.tar.zst" dl/data-seed
            pick "data-seed-$VERSION-$flavor.manifest.json" dl/data-seed
          done
          ls -l unsigned

      - name: Preflight and pin the inputs
        id: pin
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          (cd unsigned && find . -maxdepth 1 -type f ! -name INPUTS.sha256 -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > INPUTS.sha256)
          python -I tools/release/release.py preflight --stage inputs --dir unsigned --tag "$GITHUB_REF_NAME"
          echo "inputs_sha256=$(sha256sum unsigned/INPUTS.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A dry run of the metadata step: the reviewer sees what would be signed, and a release that cannot produce its
      # documents fails here instead of after the approval.
      - name: Plan the signed documents (dry run)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GENERATED: ${{ steps.tag.outputs.generated }}
        run: |
          python -I tools/release/release.py metadata --artifacts unsigned --out plan \
            --version "$VERSION" --generated "$GENERATED" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"

      - name: Summary for the reviewer
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GENERATED: ${{ steps.tag.outputs.generated }}
          INPUTS_SHA256: ${{ steps.pin.outputs.inputs_sha256 }}
        run: |
          {
            echo "## Release $GITHUB_REF_NAME, waiting for approval"
            echo
            echo "Commit \`$GITHUB_SHA\`, collected $GENERATED. **INPUTS.sha256 digest: \`$INPUTS_SHA256\`**"
            echo
            echo "Build runs:"
            sed 's/^/- /' runs.txt
            echo
            echo "| file | size | SHA-256 |"
            echo "|---|---:|---|"
            while read -r digest name; do
              printf '| %s | %s | `%s` |\n' "$name" "$(stat -c %s "unsigned/$name")" "$digest"
            done < unsigned/INPUTS.sha256
            echo
            echo "Documents to be signed (bundle digests are filled in after the RAUC re-signing):"
            echo
            python -I -c 'import json,sys; p=json.load(open("plan/release-plan.json")); print("- sequence", p["sequence"], "; generated", p["generated"], "; expires", p["expires"]); [print("- "+n+":", "complete" if ok else "NOT written, missing "+", ".join(p["missing"][n])) for n, ok in p["documents"].items()]'
            echo
            echo "Approve only if the commit is the one you tagged and the digests match the build logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: unsigned
          retention-days: 30
          if-no-files-found: error

  sign:
    name: Sign (needs approval)
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Required reviewer: Thomas. Deployment restricted to v* tags. The signing secrets are environment secrets and
    # exist nowhere else. If this environment is ever missing, GitHub creates an empty one and the steps below fail
    # for lack of keys; they cannot fall back to anything.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            minisign zstd openssl curl meson ninja-build pkg-config build-essential \
            libglib2.0-dev libglib2.0-dev-bin libjson-glib-dev libssl-dev

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned
          path: unsigned

      # Between the collect job and now the files were in artifact storage. What is signed is exactly what the reviewer
      # saw: the digest of INPUTS.sha256 is the one collect printed into the summary.
      - name: Check the inputs are the ones that were reviewed
        env:
          EXPECTED: ${{ needs.collect.outputs.inputs_sha256 }}
        run: |
          actual=$(sha256sum unsigned/INPUTS.sha256 | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED" ] || { echo "::error::INPUTS.sha256 is $actual, collect reported $EXPECTED"; exit 1; }
          (cd unsigned && sha256sum --check --strict INPUTS.sha256)

      - name: Build the pinned RAUC
        run: |
          tools/release/build-rauc.sh "$RUNNER_TEMP/rauc" | tail -1 > "$RUNNER_TEMP/rauc.path"
          cat "$RUNNER_TEMP/rauc.path"

      # The channel manifest of the last published release: its releases are carried over so that rollback targets stay
      # listed. It is verified with the committed public keys before it is used.
      - name: Previous channel manifest
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "no earlier published release"
            exit 0
          fi
          mkdir previous
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir previous --pattern manifest.json --pattern manifest.json.minisig
          python -I tools/release/release.py verify-file previous/manifest.json
          echo "path=$PWD/previous/manifest.json" >> "$GITHUB_OUTPUT"

      # The only step that sees the keys. They are written to a private directory that is removed when the step ends,
      # whatever happens; the signing script refuses key files inside the artifact directory.
      - name: Sign
        env:
          VERSION: ${{ needs.collect.outputs.version }}
          GENERATED: ${{ needs.collect.outputs.generated }}
          PREVIOUS: ${{ steps.previous.outputs.path }}
          MINISIGN_KEY: ${{ secrets.EITRI_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.EITRI_MINISIGN_PASSWORD }}
          RAUC_KEY: ${{ secrets.EITRI_RAUC_KEY }}
          RAUC_CERT: ${{ secrets.EITRI_RAUC_CERT }}
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/keys.XXXXXX")
          trap 'rm -rf "$keys"' EXIT
          for v in MINISIGN_KEY RAUC_KEY RAUC_CERT; do
            [ -n "${!v}" ] || { echo "::error::the release environment has no secret for $v"; exit 1; }
          done
          printf '%s\n' "$MINISIGN_KEY" > "$keys/minisign.sec"
          printf '%s\n' "$RAUC_KEY" > "$keys/rauc.key"
          printf '%s\n' "$RAUC_CERT" > "$keys/rauc.crt"
          args=(--in unsigned --out signed --version "$VERSION" --generated "$GENERATED" --tag "$GITHUB_REF_NAME"
                --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/")
          [ -z "$PREVIOUS" ] || args+=(--previous "$PREVIOUS")
          EITRI_MINISIGN_KEY_FILE="$keys/minisign.sec" EITRI_MINISIGN_PASSWORD="$MINISIGN_PASSWORD" \
          EITRI_RAUC_KEY_FILE="$keys/rauc.key" EITRI_RAUC_CERT_FILE="$keys/rauc.crt" \
          EITRI_RAUC="$(cat "$RUNNER_TEMP/rauc.path")" \
            tools/release/sign-release.sh "${args[@]}"

      - name: Summary
        run: |
          {
            echo "## Signed release"
            echo
            echo '```'
            cat signed/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed
          path: signed
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Attach the signed files to the draft release
    needs: [collect, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed
          path: signed

      # download-artifact can finish with a partly extracted file and still succeed. Public keys only: this job cannot
      # sign, it can only refuse.
      - name: Verify the signed set as a printer would
        run: |
          python -I tools/release/release.py verify-signed --dir signed
          (cd signed && sha256sum --check --strict SHA256SUMS)

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; refusing to change its files"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Eitri ${GITHUB_REF_NAME#v}" \
              --notes "Release candidate. Nothing in this release has been tested on a printer unless release.lock says so."
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber signed/*

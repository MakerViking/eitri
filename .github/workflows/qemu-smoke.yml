name: qemu-smoke

# Boots the Eitri OS userspace on qemu-system-aarch64 (virt machine, software emulation) and
# collects boot time, memory and per-service numbers: os/qemu/README.md.
#
# It builds the same Buildroot userspace as os-image (same rootfs overlay, packages and systemd
# units; only the boot chain and the kernel's platform options differ), so the compiler and
# download caches of that workflow are reused. Pull requests that touch the OS or the unit files
# run it; so does a weekly schedule. The numbers are CI-runner and emulation numbers, not the
# printer's: compare runs with each other.

on:
  pull_request:
    paths:
      - "os/**"
      - "release.lock"
      - "configurator/**"
      - "klarity/systemd/**"
      - "installer/**"
      - "klipper-layer/**"
      - "klarity/**"
      - "seed/**"
      - ".github/workflows/qemu-smoke.yml"
      - ".github/workflows/data-seed.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: ${{ github.workspace }}/../build

jobs:
  seed:
    name: Data seed for the /data disk
    uses: ./.github/workflows/data-seed.yml
    # A ceiling, not a grant: GitHub refuses to start a caller whose reusable workflow has any job asking for more
    # (data-seed's `publish` job needs contents: write). Its build jobs still get `read` from data-seed.yml's own
    # top-level permissions, and `publish` never runs here (attach: false).
    permissions:
      contents: write
    with:
      flavors: '["klipper"]'
      attach: false

  smoke:
    name: Build for QEMU, boot, run the first-run setup, measure
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libssl-dev unzip rsync bc cpio file wget git \
            flex bison libelf-dev openssl zstd e2fsprogs qemu-system-arm fakeroot openssh-client

      # actions/cache refuses paths containing '..' (a warning, and nothing is saved), and BUILD_ROOT is
      # github.workspace/../build. Same directory, spelled without '..', for every later step.
      - name: Resolve the build root
        run: echo "BUILD_ROOT=$(realpath -m "$BUILD_ROOT")" >> "$GITHUB_ENV"

      - name: Restore download and compiler caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BUILD_ROOT }}/br-dl
            ${{ env.BUILD_ROOT }}/br-ccache
          key: os-br-qemu-${{ hashFiles('release.lock', 'os/configs/**', 'os/package/**', 'os/qemu/**') }}
          restore-keys: |
            os-br-qemu-
            os-br-

      - name: Fetch Buildroot at the pinned commit
        run: make -C os buildroot

      # The /data disk of the QEMU guest is built from this seed by the same mkdata.sh as the printer image's data partition.
      - name: Fetch the klipper data seed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eitri-data-seed-klipper
          path: ${{ env.BUILD_ROOT }}/seed/out

      - name: Build
        run: os/qemu/build.sh

      - name: Boot and measure
        run: os/qemu/smoke-test.sh --out "$RUNNER_TEMP/smoke" --boot-timeout 1800 --collect-timeout 1800

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 30

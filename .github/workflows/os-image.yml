name: os-image

# Builds the Eitri OS disk image and the RAUC update bundle.
#
# No job here holds a signing key (docs/RELEASING.md, "Deferred signing").
#
#   pull request / push to main   development build: throwaway signing CA, nothing is published
#   v* tag                        release build: the image trusts the committed RAUC CA
#                                 (os/board/eitri-plus4/rauc/keyring.crt) and installer/keys/*.pub, the bundle is
#                                 built with a throwaway key (EITRI_DEFERRED_SIGNING=1) and uploaded as an UNSIGNED
#                                 artifact. release.yml collects it, and its protected "release" job re-signs it.
#
# A tag build fails if the public trust roots are not committed; it never falls back to the development key.

on:
  pull_request:
    paths:
      - "os/**"
      - "release.lock"
      - "camera/**"
      - "configurator/**"
      - "installer/**"
      - "klipper-layer/**"
      - "klarity/**"
      - "seed/**"
      - ".github/workflows/os-image.yml"
      - ".github/workflows/data-seed.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "os/**"
      - "release.lock"
      - "camera/**"
      - "configurator/**"
      - "installer/**"
      - "klipper-layer/**"
      - "klarity/**"
      - "seed/**"
      - ".github/workflows/os-image.yml"
      - ".github/workflows/data-seed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Buildroot, its downloads and its output live next to the checkout, outside
  # the repository, exactly as on a developer machine (os/Makefile BUILD_ROOT).
  BUILD_ROOT: ${{ github.workspace }}/../build

jobs:
  seed:
    name: Data seed for the image
    uses: ./.github/workflows/data-seed.yml
    # A ceiling, not a grant: GitHub refuses to start a caller whose reusable workflow has any job asking for more
    # (data-seed's `publish` job needs contents: write). Its build jobs still get `read` from data-seed.yml's own
    # top-level permissions, and `publish` never runs here (attach: false).
    permissions:
      contents: write
    with:
      flavors: '["klipper"]'
      attach: false

  check:
    name: Checks without a full build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libssl-dev unzip rsync bc cpio file wget \
            genimage mtools dosfstools e2fsprogs fdisk nodejs flex bison
          python -m pip install --quiet pytest

      - name: Fetch Buildroot at the pinned commit
        run: make -C os buildroot

      - name: Pins, defconfig, shell tools and image layout
        env:
          EITRI_GENIMAGE: /usr/bin/genimage
        run: make -C os check-pins check-defconfig test

  image:
    name: Build the image
    needs: [check, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git describe needs the tags to stamp the version.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Free disk space
        run: |
          # The build needs about 20 GB; the runner image carries toolchains we do not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Buildroot prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev libssl-dev unzip rsync bc cpio file wget git \
            flex bison libelf-dev openssl zstd

      # A release build starts from empty caches: ccache and download state written by pull-request
      # or branch runs must not flow into the artifacts that get signed and shipped.
      - name: Restore download and compiler caches
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.BUILD_ROOT }}/br-dl
            ${{ env.BUILD_ROOT }}/br-ccache
          key: os-br-${{ hashFiles('release.lock', 'os/configs/**', 'os/package/**', 'os/board/**/patches/**') }}
          restore-keys: |
            os-br-

      - name: Decide development or release build
        id: mode
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ ! -s os/board/eitri-plus4/rauc/keyring.crt ]; then
              echo "::error::tag build without os/board/eitri-plus4/rauc/keyring.crt (the public RAUC CA certificate); see docs/RELEASING.md"
              exit 1
            fi
            if ! compgen -G 'installer/keys/*.pub' >/dev/null; then
              echo "::error::tag build without a trusted minisign public key in installer/keys/; see docs/RELEASING.md"
              exit 1
            fi
            min_sequence=$(python3 -c 'import tomllib; print(tomllib.load(open("release.lock", "rb"))["release"]["min_manifest_sequence"])')
            {
              echo "release=1"
              echo "version=${GITHUB_REF_NAME#v}"
              echo "min_sequence=$min_sequence"
            } >> "$GITHUB_OUTPUT"
          else
            echo "release=0" >> "$GITHUB_OUTPUT"
          fi

      # The data seed for the image comes from data-seed.yml (called above): mkdata.sh installs it into the data partition.
      - name: Fetch the klipper data seed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eitri-data-seed-klipper
          path: ${{ env.BUILD_ROOT }}/seed/out

      - name: Check the seed that was downloaded
        run: |
          cd "$BUILD_ROOT/seed/out"
          sha256sum --check --strict SHA256SUMS-klipper
          ls -l

      # Deferred signing: a release build gets the public keyring and the manifest verification keys but no private key.
      # post-bundle.sh builds the bundle with a throwaway key when EITRI_DEFERRED_SIGNING=1; the real signature is
      # added by the sign job of release.yml.
      - name: Build
        env:
          EITRI_RELEASE: ${{ steps.mode.outputs.release }}
          EITRI_DEFERRED_SIGNING: ${{ steps.mode.outputs.release }}
          EITRI_REQUIRE_UPDATE_KEY: ${{ steps.mode.outputs.release }}
          EITRI_VERSION: ${{ steps.mode.outputs.version }}
          EITRI_MIN_MANIFEST_SEQUENCE: ${{ steps.mode.outputs.min_sequence }}
        run: make -C os image

      - name: Test the image tooling against the host tools that were just built
        run: |
          python -m pip install --quiet pytest
          sudo apt-get install -y --no-install-recommends nodejs mtools dosfstools fdisk
          make -C os test

      - name: Package the artifacts
        id: package
        run: |
          images="$BUILD_ROOT/br-out/images"
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out"
          version=$(os/scripts/version.sh)
          zstd -T0 -19 --quiet -o "$out/eitri-plus4-$version.img.zst" "$images/eitri-plus4.img"
          cp "$(readlink -f "$images/eitri-plus4.raucb")" "$out/eitri-plus4-$version.raucb"
          cp "$BUILD_ROOT/br-out/.config" "$out/buildroot.config"
          (cd "$out" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eitri-os-${{ steps.package.outputs.version }}${{ steps.mode.outputs.release == '1' && '-unsigned' || '-dev' }}
          path: ${{ steps.package.outputs.dir }}
          retention-days: ${{ steps.mode.outputs.release == '1' && 30 || 14 }}
          if-no-files-found: error

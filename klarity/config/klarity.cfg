# Klarity configuration -- /data/printer_data/config/klarity.cfg
# Every option is shown with its default.  Lines starting with "# TBD" need a live
# measurement on the printer before they can be finalised.

[klarity]
# Screen map (YAML).  Empty = the map shipped inside the package.
map:
# Act on map entries flagged `todo` (placeholder ids!).  Leave off on a real printer.
allow_todo: false
log_level: INFO
# Link state for the Eitri configurator (JSON, rewritten every few seconds).  Empty = off.
status_file: /run/klarity/status.json

[screen]
# The stock software opens /dev/ttyS1 at 115200 8N1, and /dev/ttyS0 and /dev/ttyS2 are the
# two MCUs, so ttyS1 is the expected panel UART.  Both values come from observing the stock
# firmware and have NOT been confirmed live on mainline yet (the 8250 numbering depends on
# the device tree): check with `klarity --learn` or by sending `sendme` at 115200.  Klarity
# refuses to start while serial_port is empty.
serial_port: /dev/ttyS1
baud: 115200
# Text codec for the panel.  The stock software sends UTF-8 (even the degree sign), so the
# panel fonts are UTF-8.  Use gb18030 only if non-ASCII text turns out garbled.
encoding: utf-8
# How " and \ inside text are sent: "backslash" (\" and \\) or "replace" (" -> ').
# TBD(hardware): verify which one the TJC firmware honours.
quote_style: backslash
# bkcmd level sent on connect (0 = no per-command status replies).
bkcmd: 0
frame_timeout: 0.5

[moonraker]
url: ws://127.0.0.1:7125/websocket
# Only needed if Moonraker does not trust 127.0.0.1 (see [authorization] trusted_clients).
api_key:
request_timeout: 10.0
backoff_min: 1.0
backoff_max: 30.0

[push]
# Minimum time between screen refresh passes, and a hard cap on instructions per second
# (115200 baud carries roughly 300 short instructions per second).
min_interval: 0.25
max_commands_per_second: 60
# Repaint the whole page this often to heal lost bytes.
full_refresh: 30

[camera]
# Camera preview page.  Klarity only fetches ustreamer's /snapshot; it never opens the camera.
enabled: false
snapshot_url: http://127.0.0.1:8080/snapshot
timeout: 3.0
# TBD(hardware): the on-panel file transfer is unverified; keep false until tested.
push_enabled: false

[learn]
# Log every event from the panel (see README, "Mapping the stock screen").
enabled: false
log_path: /data/printer_data/logs/klarity-learn.jsonl
# Seconds to watch for state changes after each touch.
window: 2.0

        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
  # ----------------------------------------------------------------------
  # page 0x23: Control: heater toggles (b0-b2), temperature numbers n0-n5 (tap -> keypad, result = 0x71 frame page=0x23 widget 0/1/2), move distance, XYZ jog, home, motors off, fan %.
  control:
    id: 35
    name: control
    widgets:
      # toggle extruder heater 0 <-> saved target
      ext_toggle:
        id: 0
        on_release:
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
          guard:
            source: extruder.target
            le: 0
          else_beep: 80
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
          guard:
            source: extruder.target
            gt: 0
          else_beep: 80
        on_number:
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET={value}
          clamp: [0, 370]
          guard:
            source: derived.state
            in: [standby, complete, cancelled, error]
          else_beep: 80
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET={value}
          clamp: [180, 370]
          guard:
            source: derived.state
            in: [printing, paused]
          else_beep: 80
      # toggle bed heater (ignored while drying_step!=0)
      bed_toggle:
        id: 1
        on_release:
        - gcode: SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=40
          guard:
            source: heater_bed.target
            le: 0
          else_beep: 80
        - gcode: SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
          guard:
            source: heater_bed.target
            gt: 0
          else_beep: 80
        on_number:
        - gcode: SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={value}
          clamp: [0, 120]
          else_beep: 80
      # toggle chamber heater (M141)
      chamber_toggle:
        id: 2
        on_release:
        - gcode: M141 S45
          guard:
            source: heater_generic chamber.target
            le: 0
          else_beep: 80
        - gcode: M141 S0
          guard:
            source: heater_generic chamber.target
            gt: 0
          else_beep: 80
        on_number:
        - gcode: M141 S{value}
          clamp: [45, 65]
          zero_ok: true
          else_beep: 80
      # jog/extrude distance 1 mm (stateful in host: printer_move_dist and printer_filament_extruedr_dist)
      d1:
        id: 6
        todo: true
        on_release:
        - log: move_dist=1
      # distance 10 mm
      d10:
        id: 7
        todo: true
        on_release:
        - log: move_dist=10
      # distance 50 mm
      d50:
        id: 8
        todo: true
        on_release:
        - log: move_dist=50
      # distance 100 mm
      d100:
        id: 9
        todo: true
        on_release:
        - log: move_dist=100
      # G28 (after check_conflict)
      home:
        id: 10
        on_release:
        - gcode: G28
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # M84 (after check_conflict)
      motors_off:
        id: 11
        on_release:
        - gcode: M84
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog Y+: "G91\nG1 Y+<dist> F7800\nG90" (stock host); fixed 10 mm fallback here
      y_plus:
        id: 14
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 Y+10 F7800
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog Y-
      y_minus:
        id: 15
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 Y-10 F7800
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog X-
      x_minus:
        id: 16
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 X-10 F7800
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog X+
      x_plus:
        id: 17
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 X+10 F7800
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog Z- (F600)
      z_minus:
        id: 18
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 Z-10 F600
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # jog Z+ (F600)
      z_plus:
        id: 19
        on_release:
        - gcode: 'SAVE_GCODE_STATE NAME=klarity_jog
      
            G91
      
            G1 Z+10 F600
      
            RESTORE_GCODE_STATE NAME=klarity_jog'
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # open fan control page 0x3a
      fans:
        id: 22
        on_release:
        - page: fans
        on_number:
        - gcode: M106 P0 S{value}
          clamp: [0, 100]
          scale: 2.55
          else_beep: 80
      # numeric entry only: auxiliary/chamber fan percent typed on the keypad
      fan_aux_value:
        id: 23
        on_number:
        - gcode: M106 P2 S{value}
          clamp: [0, 100]
          scale: 2.55
          else_beep: 80
      # numeric entry only: auxiliary/chamber fan percent typed on the keypad
      fan_chamber_value:
        id: 24
        on_number:
        - gcode: M106 P3 S{value}
          clamp: [0, 100]
          scale: 2.55
          else_beep: 80
      # part-cooling fan % (fan_generic cooling_fan.speed*100) [stock fan0 / M106 P0]
      n_fan0:
        obj: n6
        bind:
        - source: fan_generic cooling_fan.speed
          attr: val
          scale: 100
      # auxiliary fan % (fan_generic auxiliary_cooling_fan) [fan2 / M106 P2]
      n_fan2:
        obj: n7
        bind:
        - source: fan_generic auxiliary_cooling_fan.speed
          attr: val
          scale: 100
      # chamber circulation fan % (fan_generic chamber_circulation_fan) [fan3 / M106 P3]
      n_fan3:
        obj: n8
        bind:
        - source: fan_generic chamber_circulation_fan.speed
          attr: val
          scale: 100
      # extruder temp
      n_ext:
        obj: n0
        bind:
        - source: extruder.temperature
          attr: val
        - source: extruder.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # extruder target
      n_ext_t:
        obj: n3
        bind:
        - source: extruder.target
          attr: val
      # bed temp
      n_bed:
        obj: n1
        bind:
        - source: heater_bed.temperature
          attr: val
        - source: heater_bed.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # bed target
      n_bed_t:
        obj: n4
        bind:
        - source: heater_bed.target
          attr: val
      # chamber temp
      n_ch:
        obj: n2
        bind:
        - source: heater_generic chamber.temperature
          attr: val
        - source: heater_generic chamber.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # chamber target
      n_ch_t:
        obj: n5
        bind:
        - source: heater_generic chamber.target
          attr: val
      # switch to extrude/retract tab (page 0x24)
      extruder_tab:
        id: 3
        on_release:
        - page: control_extrude
      nav_main:
        id: 33
        on_release:

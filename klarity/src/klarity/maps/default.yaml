        - log: set_offset=0.05
      # select 0.1
      step_01:
        id: 8
        todo: true
        on_release:
        - log: set_offset=0.1
      # select 0.5
      step_05:
        id: 9
        todo: true
        on_release:
        - log: set_offset=0.5
      # SET_GCODE_OFFSET Z_ADJUST=-<step> MOVE=1 (fixed 0.01 fallback)
      z_down:
        id: 10

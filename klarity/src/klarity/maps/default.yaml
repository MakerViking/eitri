        id: 8
        on_release:
        - page: wifi_list
      # Eitri repurposes the stock "accounts" button (widget 9, unconfirmed and inert; the stock host
      # only logged an account list for it, and Eitri has no accounts) as "Unlock setup" (Decision 8).  The .tft cannot get a new
      # widget, so the button keeps its stock label; the result goes into the page's one known text
      # field t7 (where the stock host showed the IP address): "Code 1234-5678 at 192.168.0.5:8099".
      # Runs `sudo -n eitri-configurator unlock`, starts the configurator and reads its pairing code;
      # refused while printing/paused (guard here, and again in the runner).  The text is replaced by
      # the stock page's own content the next time the page is entered.
      unlock_setup:
        id: 9
        on_release:
        - unlock: setup
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
          else_beep: 80
        - set:  # same guard: a blocked unlock defines no {message}
            obj: t7
            attr: txt
            value: '{message}'

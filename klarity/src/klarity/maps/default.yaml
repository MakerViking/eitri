        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x62: Drying: type selected summary (t2 name, t12 bed temp, t14 chamber temp, t15 minutes from drying.conf)
  dry_select:
    id: 98
    name: dry_select
    widgets:
      done:
        id: 0
        todo: true
        on_release:
        - log: drying_step=0
      start:
        id: 1
        todo: true
        on_release:
        - log: 'start_drying: set bed/chamber target from dry_map; drying_step=4'
      choose:
        id: 2
        todo: true
        on_release:
        - log: show_dry_type -> page 0x63
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x63: Drying: choose material (5 per page via selected_type(1..5), pager widgets 6/7)
  dry_types:
    id: 99
    name: dry_types
    widgets:
      ok:
        id: 0
        todo: true
        on_release:
        - log: go_to_dry_tips
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x64: Drying running (t11 bed temp, t13 chamber temp, t15 remaining minutes); widget 0 sets stop_dry_flag
  dry_running:
    id: 100
    name: dry_running
    widgets:
      stop:
        id: 0
        todo: true
        on_release:
        - log: stop_dry_flag=1
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x65: Drying finished
  dry_finished:
    id: 101
    name: dry_finished
    widgets:
      ok:
        id: 0
        on_release:
        - page: tools
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x2a: Popup: motion attempted while unhomed (host sends SET_KINEMATIC_POSITION + small move; then widget 0 homes: G28 and returns to control)
  moved_unhomed_popup:
    id: 42
    name: moved_unhomed_popup
    widgets:
      home:
        id: 0
        on_release:
        - gcode: G28
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
        - page: control
      cancel:
        id: 1
        on_release:
        - page: control
  # ----------------------------------------------------------------------
  # page 0x2b: Generic "return to previous page" popup (host jumps back via previous_page_id)
  dismiss:
    id: 43
    name: dismiss
    widgets:
      ok:
        id: 0
        todo: true
        on_release:
        - log: page_to(previous_page_id) with special cases
      again:
        id: 1
        todo: true
        on_release:
        - log: page_to(0x2b)
  # ----------------------------------------------------------------------
  # page 0x2d: Gcode error popup that cancels the print (t0 = "gcode error:<msg>")
  error_cancel:
    id: 45
    name: error_cancel
    widgets:
      ok:
        id: 0
        on_release:
        - page: home
      # error text prefixed "gcode error:"
      msg:
        obj: t0
        bind:
        - source: derived.message
          format: gcode error:{}
  # ----------------------------------------------------------------------
  # page 0x2c: Gcode error popup (t0 = message)
  error:
    id: 44
    name: error
    widgets:
      ok:
        id: 0
        on_release:
        - page: home
      # error text
      msg:
        obj: t0
        bind:
        - source: derived.message
  # ----------------------------------------------------------------------
  # page 0x2e: Boot logo / TFT-update screen; widget 0 -> finish_tjc_update + home
  logo:
    id: 46
    name: logo
    widgets:
      # stock also runs a display-update cleanup
      ok:
        id: 0
        on_release:
        - page: home
  # ----------------------------------------------------------------------
  # page 0x31: Popup: no filament detected before print (filament sensor fila)
  no_filament:
    id: 49
    name: no_filament
    widgets:
      ok:
        id: 0
        on_release:
        - page: control
  # ----------------------------------------------------------------------
  # page 0x32: Popup: filament runout during print (filament_switch_sensor fila filament_detected 1->0)
  filament_runout:
    id: 50
    name: filament_runout
    widgets:
      ok:
        id: 0
        on_release:
        - page: control
  # ----------------------------------------------------------------------
  # page 0x35: Cancel print confirmation
  cancel_confirm:
    id: 53
    name: cancel_confirm
    widgets:
      # CONFIRM cancel: stock cancel: QIDI-fork Moonraker break endpoints + CANCEL_PRINT, then page 0x37 (stopping). Klarity: Moonraker printer.print.cancel
      confirm:
        id: 0
        on_release:
        - print: cancel
          guard:
            source: derived.state
            in:
            - printing
            - paused
          cooldown: 2.0
          else_beep: 80
      # do not cancel
      back:
        id: 1
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
  # ----------------------------------------------------------------------
  # page 0x36: Popup (jump_to_move_pop_2 -> restore_status); ok returns to control
  popup_36:
    id: 54
    name: popup_36
    widgets:
      ok:
        id: 0
        on_release:
        - page: control
  # ----------------------------------------------------------------------
  # page 0x37: Cancelling... (auto-returns to home when print_stats.state is standby)
  stopping:
    id: 55
    name: stopping
    widgets: {}
  # ----------------------------------------------------------------------
  # page 0x38: Power-loss/interrupted print recovery prompt (shown when saved_variables was_interrupted != False)
  resume_interrupted:
    id: 56
    name: resume_interrupted
    widgets:
      # Eitri: QD_PLR_RESUME CONFIRM=1 (qd_plr), then the waiting page 0x4b
      resume:
        id: 0
        on_release:
        - gcode: QD_PLR_RESUME CONFIRM=1
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
        - page: print_wait
      # Eitri: QD_PLR_CLEAR forgets the recorded interrupted print, then home
      discard:
        id: 1
        on_release:
        - gcode: QD_PLR_CLEAR
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
        - page: home
      dismiss:
        id: 2
        todo: true
        on_release:
        - log: jump_to_resume_print=0
  # ----------------------------------------------------------------------
  # page 0x4b: Waiting page after RESUME_INTERRUPTED (static)
  print_wait:
    id: 75
    name: print_wait
    widgets: {}
  # ----------------------------------------------------------------------
  # page 0x39: Memory warning popup
  memory_warning:
    id: 57
    name: memory_warning
    widgets:
      ok:
        id: 0
        on_release:
        - page: home
  # ----------------------------------------------------------------------
  # page 0x44: Busy popup (shown whenever the busy check blocks an action: webhooks shutdown/error or on_process); ok => back (error->system page, tools active->tools, load/unload->control, else main)
  busy:
    id: 68
    name: busy
    widgets:
      ok:
        id: 0
        todo: true
        on_release:
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
  # ----------------------------------------------------------------------
  # page 0x46: Popup: temperature too low for filament action; ok => clear load/unload steps and return
  low_temp:
    id: 70
    name: low_temp
    widgets:
      ok:
        id: 0
        on_release:
        - page: control
  # ----------------------------------------------------------------------
  # page 0x49: Popup: bed target < 35 C for auto level
  autolevel_low_bed_temp:
    id: 73
    name: autolevel_low_bed_temp
    widgets:
      ok:
        id: 0
        on_release:
        - page: tools
  # ----------------------------------------------------------------------
  # page 0x66: Hidden debug page (width sensor "t8")
  debug:
    id: 102
    name: debug
    widgets:
      back:
        id: 0
        on_release:
        - page: home
      width:
        id: 1
        todo: true
        on_release:
        - log: 'show_width: query_filament_width'

# One-byte markers the stock project sends with `printh` (names from the host's handler).

markers:
  0x91: {name: go_home, page: home, todo: true}          # host: current_page_id=0; page_to(0x2e) (logo/boot screen)
  0xf9: {name: enter_user_page, todo: true}
  0xfa: {name: leave_user_page, todo: true}
  0xfb: {name: enter_qr_page, todo: true}
  0xfc: {name: leave_qr_page, todo: true}
  0x92: {name: enter_network_detect, todo: true}
  0x93: {name: leave_network_detect, todo: true}

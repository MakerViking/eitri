# Klarity screen map for the stock QIDI X-Plus 4 TJC/Nextion display program
# ===========================================================================================
#
#  STATUS: partial.  Page ids, widget ids and component names were derived from observing how
#  the stock host software drives the display (interoperability facts only; no code, assets or
#  strings from the stock firmware are included).  They have NOT yet been confirmed against a
#  live panel.  Entries flagged `todo: true` are either unconfirmed or need behaviour this
#  schema cannot express; Klarity IGNORES them unless allow_todo is set.
#
#  Before trusting the map on a real printer, run `klarity --learn --dry-run` once, tap through
#  the pages, and compare the learn log with this file.  Open questions (see meta):
#    * the stock program reports a tap without an edge (``65 page widget FF FF FF``, seen live);
#      Klarity runs the widget's on_release, else its on_press, for it;
#    * page jumps that happen inside the display program and are invisible to the host.
#
#  Fill in or fix entries with `klarity --learn`, then run `klarity --check-map`.
#
#  Schema (version 1)
#  ------------------
#  screen.init      list of raw Nextion instructions sent after every (re)connect.
#  pages.<key>      id (Nextion page id, as reported in touch events), name (Nextion page
#                   name, used by `page` if id is null), todo,
#                   widgets, on_enter / on_number / on_string (action lists)
#  widgets.<key>    id  : component id as reported in touch events (input)
#                   obj : component name on the panel (output, e.g. t0, j0)
#                   bind: one or more state -> attribute bindings (see below)
#                   on_press / on_release : action list (Nextion touch type 1 / 0)
#  bind             source : state path ("extruder.temperature", "heater_generic chamber.target",
#                            "derived.progress") or a list of paths when `format` combines them
#                   attr   : Nextion attribute (txt, val, vis, bco, pco, pic, picc ...), default txt
#                   format : Python format string for text ("{:.0f} C", "{0:.0f} / {1:.0f}")
#                   scale  : multiplier for numeric values
#                   test   : {eq|ne|gt|ge|lt|le|in|not_in|truthy: arg} -> 1/0 (for vis, pic ...)
#                   map    : value -> output (colours as "#rrggbb"); "_default" is the fallback
#                   default: value to show when the source is unavailable
#                   Bindings are only pushed while their page is showing, and only on change.
#  action           exactly one verb:  gcode: "..."   print: pause|resume|cancel|start|...
#                                      page: <page key>   beep: <ms>   log: "..."
#                                      set: {obj, attr, value}   unlock: setup
#                   optional modifiers: guard: {source, <test>}   cooldown: <s>
#                                       read: {var: "obj.attr"}  (ask the panel, use as {var})
#                                       else_beep: <ms>  (when the guard blocks)
#                   print verbs other than emergency_stop REQUIRE a guard; emergency_stop needs
#                   either a guard or `unguarded: true`.  A todo widget with an emergency_stop
#                   stays inert even with allow_todo until `todo` is removed.
#                   `unlock: setup` (REQUIRES a guard) reopens the configurator's pairing and sets
#                   {code} {host} {url} {message} for the actions after it in the same list.
#                   Placeholders {value} / {text} / {page} / {widget} and read-vars are
#                   substituted into gcode; text from the panel is restricted to [\w .+-/].
#  derived.*        state, progress, elapsed, remaining, filename, layer, total_layers,
#                   message, speed_percent, flow_percent, speed_mms, z, homed, is_printing, is_paused
#  widget.on_number  actions for a number typed on the panel's keypad (the stock program
#                   reports it as an unsolicited 0x71 frame: page, widget, 16-bit value).
#                   Per-action modifiers for {value}:  clamp: [lo, hi]  zero_ok: true (0
#                   passes unclamped)  scale: factor (applied after clamping, rounded).
#  bind.offset      added to the (scaled) numeric value, e.g. a picture index = percent + 138
#  widget.on_number  actions for a number typed on the panel's keypad (the stock program
#                   reports it as an unsolicited 0x71 frame: page, widget, 16-bit value).
#                   Per-action modifiers for {value}:  clamp: [lo, hi]  zero_ok: true (0
#                   passes unclamped)  scale: factor (applied after clamping, rounded).
#  bind.offset      added to the (scaled) numeric value, e.g. a picture index = percent + 138
# ===========================================================================================

version: 1

meta:
  tft: stock program for the 800x480 TJC display (unmodified)
  display: TJC 800x480
  status: partial
  touch_event_note: >-
    The stock display program sends one 0x65 frame per tap, without the standard type byte
    (65 page widget FF FF FF, confirmed live 2026-10-25). Klarity reports it as a tap and runs the
    widget's on_release, else its on_press. Standard frames with a type byte match that edge only.
  numeric_event_note: >-
    The stock display program reports a number typed on a keypad as a custom frame
    71 <page> <widget> <value_lo> <value_hi> FF FF FF (not the standard 4-byte value).
    Klarity decodes it for unsolicited frames and dispatches widget.on_number.
  not_yet_expressible:
    - file browser, preview and print start (pages 4 and 5)
    - "session variables: move/extrude distance, z-offset step, calibration step counters, load target"
    - persisted heater presets (Klarity uses fixed 200 / 40 / 40)
    - thumbnail push (picture component, 921600 baud burst)
    - automatic page changes driven by printer state (the stock host forces pages on events)

screen:
  # The stock host's start-up handshake (notes/screen-map/serial.md, init step 6). Without it the .tft's own
  # timeout shows its "system starts abnormally, restart" page (page 1) and stays there.
  # The value is QIDI's release (1.7.3 -> 0010703) and must match the .tft on the panel, which compares it
  # and otherwise shows "UI version doesn't match firmware". 1.7.3 is the latest .tft QIDI's updater installs.
  init:
  - logo.version.val=0010703
  - page 3

pages:
  # ----------------------------------------------------------------------
  # page 0x03: Main/status page. Auto-entered when idle; while printing the host forces page 0x11.
  home:
    id: 3
    name: home
    widgets:
      # toggle case light (SET_PIN PIN=caselight VALUE=0|1); icon b0 picc: off=11/9, on=12/10 (picc/picc2)
      led:
        id: 0
        obj: b0
        bind:
        - source: output_pin caselight.value
          attr: picc
          test:
            gt: 0
          map:
            false: 11
            true: 12
        - source: output_pin caselight.value
          attr: picc2
          test:
            gt: 0
          map:
            false: 9
            true: 10
        on_release:
        - gcode: SET_PIN PIN=caselight VALUE=1
          guard:
            source: output_pin caselight.value
            le: 0
        - gcode: SET_PIN PIN=caselight VALUE=0
          guard:
            source: output_pin caselight.value
            gt: 0
      # open Network settings (stock also sets set_mode=Network)
      network:
        id: 1
        on_release:
        - page: network
      # the stock host's internal name suggests motors-off, but it sends printer.emergency_stop, waits 1 s, then FIRMWARE_RESTART. Label on the .tft unconfirmed -> left todo (destructive).
      estop:
        id: 2
        todo: true
        on_release:
        - print: emergency_stop
          unguarded: true
        - print: firmware_restart
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
          else_beep: 80
      # open preview (page 5) of the most recent cached file (t3/cp0 show it). Needs file-browser code.
      last_file:
        id: 3
        todo: true
        on_release:
        - log: 'stock: open last cached file preview'
      # toggle extruder heater between 0 and last saved target (host setting, default 200). Klarity: fixed 200.
      nozzle_toggle:
        id: 4
        on_release:
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
          guard:
            source: extruder.target
            le: 0
          else_beep: 80
        - gcode: SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
          guard:
            source: extruder.target
            gt: 0
          else_beep: 80
      # toggle bed heater (saved target default 40)
      bed_toggle:
        id: 5
        on_release:
        - gcode: SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=40
          guard:
            source: heater_bed.target
            le: 0
          else_beep: 80
        - gcode: SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
          guard:
            source: heater_bed.target
            gt: 0
          else_beep: 80
      # toggle chamber heater via M141 (stock default 40, raised to the 45 minimum by the layer; range 45..65 when set by keypad)
      chamber_toggle:
        id: 6
        on_release:
        - gcode: M141 S45
          guard:
            source: heater_generic chamber.target
            le: 0
          else_beep: 80
        - gcode: M141 S0
          guard:
            source: heater_generic chamber.target
            gt: 0
          else_beep: 80
      # hidden debug page (page 0x66)
      debug:
        id: 102
        todo: true
        on_release:
        - page: debug
      # nozzle temp (val)
      n_nozzle:
        obj: n0
        bind:
        - source: extruder.temperature
          attr: val
        - source: extruder.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # bed temp (val)
      n_bed:
        obj: n1
        bind:
        - source: heater_bed.temperature
          attr: val
        - source: heater_bed.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # chamber temp (val)
      n_chamber:
        obj: n2
        bind:
        - source: heater_generic chamber.temperature
          attr: val
        - source: heater_generic chamber.target
          attr: pco
          test:
            gt: 0
          map:
            true: '#ff0000'
            false: '#ffffff'
      # name of most recent cached file (t3.txt); thumbnail component cp0 (272x272) + q0 visibility
      t_lastfile:
        obj: t3
        bind:
        - source: derived.filename
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x04: File browser: Local (gcodes/) or USB (/sda1), 6 rows per page; server.files.get_directory listing, type prefix [c]/[d]/[f]. Needs a code module (not expressible in YAML).
  files:
    id: 4
    name: files
    widgets:
      # row 0: name in t0.txt, type icon b0 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_0:
        id: 0
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(0)
      # row 1: name in t1.txt, type icon b1 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_1:
        id: 1
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(1)
      # row 2: name in t2.txt, type icon b2 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_2:
        id: 2
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(2)
      # row 3: name in t3.txt, type icon b3 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_3:
        id: 3
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(3)
      # row 4: name in t4.txt, type icon b4 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_4:
        id: 4
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(4)
      # row 5: name in t5.txt, type icon b5 picc/picc2 ([c] cache=15/16, [f] file=15/16, [d] dir=18/19, empty=13); click opens dir or file preview (page 5)
      file_5:
        id: 5
        todo: true
        on_release:
        - log: stock get_sub_dir_files_list(5)
      # switch to Local gcodes (file_mode=Local)
      tab_local:
        id: 6
        todo: true
        on_release:
        - log: file_mode=Local; refresh
      # switch to USB stick (file_mode=USB, path /sda1)
      tab_usb:
        id: 7
        todo: true
        on_release:
        - log: file_mode=USB; refresh
      # parent directory
      up:
        id: 8
        todo: true
        on_release:
        - log: get_parenet_dir_files_list
      # previous page of 6 rows
      prev_page:
        id: 9
        todo: true
        on_release:
        - log: page_files_current_pages-1
      # next page of 6 rows
      next_page:
        id: 10
        todo: true
        on_release:
        - log: page_files_current_pages+1
      # current path, or "NO USB" in USB mode when no stick
      path_text: {}
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x05: File preview/start-print page (thumbnail cp0, name, estimated time). Started via printer.print.start.
  file_preview:
    id: 5
    name: file_preview
    widgets:
      # back to file list (also: if print paused/printing -> page 0x11)
      back:
        id: 0
        todo: true
        on_release:
        - log: back to files
      # START PRINT of selected file: host first runs query_filament_width, then G31 (bed-mesh/leveling ON) or G32 (OFF) per widget-2 flag, then printer.print.start; may divert to filament popups 0x06/0x07 (PLA/PETG|ABS reminders) or 0x31 (no filament) or 0x86 (box)
      start:
        id: 1
        todo: true
        on_release:
        - log: 'stock: start print'
      # toggle "auto bed leveling" flag (printer_bed_leveling): 1 -> G31, 0 -> G32 before start. G31/G32 are Qidi macros setting G29 variable k=1/0
      leveling_toggle:
        id: 2
        todo: true
        on_release:
        - log: toggle bed leveling flag
      # toggle Moonraker timelapse: POST /machine/timelapse/settings?enabled=True|False (state: GET same URL .result.enabled)
      timelapse_toggle:
        id: 3
        todo: true
        on_release:
        - log: POST timelapse enabled toggle
      # QIDI Box (multi-colour) enable toggle
      box_toggle:
        id: 4
        todo: true
        on_release:
        - log: MultiColorSlots::switch_enable_box
      # estimated time (file metadata estimated_time) via show_time format "NhMm", "-" if unknown
      t_time: {}
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x06: Pre-print reminder shown when filament_type contains pla/petg (pref pops.pop_1)
  popup_pla_petg:
    id: 6
    name: popup_pla_petg
    widgets:
      # continue (print already started)
      ok:
        id: 0
        on_release:
        - page: printing
      # do not show again
      dont_show:
        id: 1
        todo: true
        on_release:
        - log: write host setting pop_1=0
        - page: printing
  # ----------------------------------------------------------------------
  # page 0x07: Pre-print reminder shown when filament_type contains abs (pref pops.pop_2)
  popup_abs:
    id: 7
    name: popup_abs
    widgets:
      # continue
      ok:
        id: 0
        on_release:
        - page: printing
      # do not show again
      dont_show:
        id: 1
        todo: true
        on_release:
        - log: write host setting pop_2=0
        - page: printing
  # ----------------------------------------------------------------------
  # page 0x08: Resonance (input shaper) test: intro
  shaper_ready:
    id: 8
    name: shaper_ready
    widgets:
      # start resonance test: stock runs macro M901 (G28; SHAPER_CALIBRATE; M118; SAVE_CONFIG) and enters page 9. Refused when printing/calibrating.
      start:
        id: 3
        todo: true
        on_release:
        - gcode: M901
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
          else_beep: 80
      # back to tools hub
      back:
        id: 4
        on_release:
        - page: tools
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x09: Resonance test running (same handler as page 8)
  shaper_running:
    id: 9
    name: shaper_running
    widgets:
      # same as page 8 widget 3
      start:
        id: 3
        on_release:
        - log: already running
      # back
      back:
        id: 4
        on_release:
        - page: tools
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0a: Bed screw calibration (BED_SCREWS_ADJUST flow): intro
  bed_screws_ready:
    id: 10
    name: bed_screws_ready
    widgets:
      # begin: stock sets calibrate_last_time and opens warning page 0x4a
      start:
        id: 3
        on_release:
        - page: bed_screws_warning
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
      # back
      back:
        id: 8
        on_release:
        - page: tools
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0b: Bed screw calibration step page (shared handler; calibrate_step counter 1..6; stock rate-limits "next" to once per 3 s)
  bed_screws_step1:
    id: 11
    name: bed_screws_step1
    widgets:
      # next step: the stock host advances its calibration step and runs: step1 ABORT;M4031;M4030 | step2 G1 Z10;BED_SCREWS_ADJUST;G1 Z<bed_offset> | step3-5 ACCEPT;G1 Z<bed_offset> | step6 ACCEPT;G1 Z10;G1 X0 Y0
      next:
        id: 3
        todo: true
        on_release:
        - log: bed-screw step
      # adjust step 0.01 mm
      dist_001:
        id: 4
        todo: true
        on_release:
        - log: auto_level_dist=0.01
      # adjust step 0.05 mm
      dist_005:
        id: 5
        todo: true
        on_release:
        - log: auto_level_dist=0.05
      # adjust step 0.1 mm
      dist_01:
        id: 6
        todo: true
        on_release:
        - log: auto_level_dist=0.1
      # adjust step 0.5 mm
      dist_05:
        id: 7
        todo: true
        on_release:
        - log: auto_level_dist=0.5
      # bed_adjust(true): "G91\nG1 Z-<dist> F600\nG90"; bed_offset -= dist
      z_down:
        id: 8
        todo: true
        on_release:
        - log: bed_adjust(true)
      # bed_adjust(false): "G91\nG1 Z+<dist> F600\nG90"; bed_offset += dist
      z_up:
        id: 9
        todo: true
        on_release:
        - log: bed_adjust(false)
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0c: Bed screw calibration step page (shared handler; calibrate_step counter 1..6; stock rate-limits "next" to once per 3 s)
  bed_screws_step2:
    id: 12
    name: bed_screws_step2
    widgets:
      # next step: the stock host advances its calibration step and runs: step1 ABORT;M4031;M4030 | step2 G1 Z10;BED_SCREWS_ADJUST;G1 Z<bed_offset> | step3-5 ACCEPT;G1 Z<bed_offset> | step6 ACCEPT;G1 Z10;G1 X0 Y0
      next:
        id: 3
        todo: true
        on_release:
        - log: bed-screw step
      # adjust step 0.01 mm
      dist_001:
        id: 4
        todo: true
        on_release:
        - log: auto_level_dist=0.01
      # adjust step 0.05 mm
      dist_005:
        id: 5
        todo: true
        on_release:
        - log: auto_level_dist=0.05
      # adjust step 0.1 mm
      dist_01:
        id: 6
        todo: true
        on_release:
        - log: auto_level_dist=0.1
      # adjust step 0.5 mm
      dist_05:
        id: 7
        todo: true
        on_release:
        - log: auto_level_dist=0.5
      # bed_adjust(true): "G91\nG1 Z-<dist> F600\nG90"; bed_offset -= dist
      z_down:
        id: 8
        todo: true
        on_release:
        - log: bed_adjust(true)
      # bed_adjust(false): "G91\nG1 Z+<dist> F600\nG90"; bed_offset += dist
      z_up:
        id: 9
        todo: true
        on_release:
        - log: bed_adjust(false)
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0d: Bed screw calibration step page (shared handler; calibrate_step counter 1..6; stock rate-limits "next" to once per 3 s)
  bed_screws_moving:
    id: 13
    name: bed_screws_moving
    widgets:
      # next step: the stock host advances its calibration step and runs: step1 ABORT;M4031;M4030 | step2 G1 Z10;BED_SCREWS_ADJUST;G1 Z<bed_offset> | step3-5 ACCEPT;G1 Z<bed_offset> | step6 ACCEPT;G1 Z10;G1 X0 Y0
      next:
        id: 3
        todo: true
        on_release:
        - log: bed-screw step
      # adjust step 0.01 mm
      dist_001:
        id: 4
        todo: true
        on_release:
        - log: auto_level_dist=0.01
      # adjust step 0.05 mm
      dist_005:
        id: 5
        todo: true
        on_release:
        - log: auto_level_dist=0.05
      # adjust step 0.1 mm
      dist_01:
        id: 6
        todo: true
        on_release:
        - log: auto_level_dist=0.1
      # adjust step 0.5 mm
      dist_05:
        id: 7
        todo: true
        on_release:
        - log: auto_level_dist=0.5
      # bed_adjust(true): "G91\nG1 Z-<dist> F600\nG90"; bed_offset -= dist
      z_down:
        id: 8
        todo: true
        on_release:
        - log: bed_adjust(true)
      # bed_adjust(false): "G91\nG1 Z+<dist> F600\nG90"; bed_offset += dist
      z_up:
        id: 9
        todo: true
        on_release:
        - log: bed_adjust(false)
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x4a: Calibration warning popup
  bed_screws_warning:
    id: 74
    name: bed_screws_warning
    widgets:
      # M84.1 = original Klipper M84 (all steppers off) so the bed can be turned by hand
      release_motors:
        id: 0
        todo: true
        on_release:
        - gcode: M84.1
          guard:
            source: derived.state
            in:
            - standby
            - complete
            - cancelled
            - error
      back:
        id: 1
        on_release:
        - page: bed_screws_ready
      # busy check; marks a tool as running; resets the bed-screw calibration steps
      go:
        id: 2
        todo: true
        on_release:
        - log: start bed_calibrate step1
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0e: Auto-level (probe + z-offset) intro/heater-bed temp entry
  autolevel_ready:
    id: 14
    name: autolevel_ready
    widgets:
      # opens keypad page 0x10 (numeric entry; result arrives as 0x71 frame page=0x0e widget=4)
      set_bed_temp:
        id: 0
        todo: true
        on_release:
        - page: autolevel_result
      # start auto-level: stock auto-level start: bed target=saved; macros M4031, M4029, M190 S<bed>, M4027
      start:
        id: 3
        todo: true
        on_release:
        - log: start_auto_level
      back:
        id: 6
        on_release:
        - page: tools
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x0f: Auto-level running (same handler as 0x0e)
  autolevel_running:
    id: 15
    name: autolevel_running
    widgets:
      start:
        id: 3
        todo: true
        on_release:
        - log: same as 0x0e
      back:
        id: 6
        on_release:
        - page: tools
      # nozzle temp
      t_nozzle:
        obj: t6
        bind:
        - source: extruder.temperature
          attr: txt
          format: '{:.0f}'
      # nozzle target
      t_nozzle_t:
        obj: t7
        bind:
        - source: extruder.target
          attr: txt
          format: '{:.0f}'
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x10: Auto-level second page: opened by widget 0 of 0x0e; refresh_page_zoffset pushes the bed-mesh z values into t<row*9+col> (up to 9 columns); purpose partly inferred (keypad/mesh view)
  autolevel_result:
    id: 16
    name: autolevel_result
    widgets:
      nav_main:
        id: 33
        on_release:
        - page: printing
          guard:
            source: derived.state
            in:
            - printing
            - paused
        - page: home
          guard:
            source: derived.state
            not_in:
            - printing
            - paused
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------
  # page 0x11: Printing page (auto-entered when print_stats.state is printing/paused)
  printing:
    id: 17
    name: printing
    widgets:
      # open cancel-confirm page 0x35
      stop:
        id: 0
        on_release:
        - page: cancel_confirm
      # pause/resume toggle. Stock: only if no load/unload in progress, else shows busy popup 0x44. icon b1 picc/picc2 selects pause vs play glyph
      pause_resume:
        id: 1
        on_release:
        - print: pause
          guard:
            source: derived.state
            eq: printing
          cooldown: 1.0
          else_beep: 80
        - print: resume
          guard:
            source: derived.state
            eq: paused
          cooldown: 1.0
          else_beep: 80
      # open numeric keypad page 0x12 for FLOW % (result: 0x71 frame page=0x11 widget=2 -> M221 S<v>, clamp 150)
      flow_keypad:
        id: 2
        on_release:
        - page: keypad
        on_number:
        - gcode: M221 S{value}
          clamp: [10, 150]
          else_beep: 80
      # open numeric keypad for SPEED % (0x71 frame page=0x11 widget=3 -> M220 S<v>, clamp 150)
      speed_keypad:
        id: 3
        on_release:
        - page: keypad
        on_number:
        - gcode: M220 S{value}
          clamp: [10, 150]
          else_beep: 80
      # open z-offset/babystep panel (page 0x13)
      zoffset_panel:
        id: 4
        on_release:
        - page: zoffset_panel
      # case light toggle (same as home)
      led:
        id: 5
        obj: b5
        bind:
        - source: output_pin caselight.value
          attr: picc
          test:
            gt: 0
          map:
            false: 11
            true: 12
        on_release:
        - gcode: SET_PIN PIN=caselight VALUE=1
          guard:
            source: output_pin caselight.value
            le: 0
        - gcode: SET_PIN PIN=caselight VALUE=0
          guard:
            source: output_pin caselight.value
            gt: 0
      # silent-mode toggle: M220 S50 <-> M220 S100 (speed factor 50%/100%); icon b13 reflects printer_muted
      quiet:
        id: 13
        on_release:
        - gcode: M220 S50
          guard:
            source: derived.speed_percent
            gt: 50
        - gcode: M220 S100
          guard:
            source: derived.speed_percent
            le: 50
      debug:
        id: 102
        todo: true
        on_release:
        - page: debug
      # progress bar: picture index = percent + 138
      p_progress:
        obj: p0
        bind:
        - source: derived.progress
          attr: pic
          offset: 138
      # progress "NN%"
      t_percent:
        obj: t7
        bind:
        - source: derived.progress
          format: '{:.0f}%'
      # elapsed print_duration, format "NhMm"
      t_elapsed:
        obj: t0
        bind:
        - source: derived.elapsed
      # remaining: progress<11% -> estimate-elapsed else elapsed*100/progress-elapsed
      t_remaining:
        obj: t1
        bind:
        - source: derived.remaining
          default: --
      # speed factor % (gcode_move.speed_factor*100)
      t_speed:
        obj: t3
        bind:
        - source: derived.speed_percent
          format: '{}'
      # flow factor % (gcode_move.extrude_factor*100)
      t_flow:
        obj: t2
        bind:
        - source: derived.flow_percent
          format: '{}'
      # z offset text (gcode_move homing_origin z / z_offset), decimals trimmed
      t_zoffset:
        obj: t4
        bind:
        - source: gcode_move.homing_origin.2
          format: '{:.2f}'
      # nozzle temp (page 0x11 only)
      n_nozzle:
        obj: n0
        bind:
        - source: extruder.temperature
          attr: val
      # target text "<target>℃" (UTF-8 U+2103 in stock)
      t_nozzle_tgt:
        obj: t8
        bind:
        - source: extruder.target
          format: /{:.0f}℃
      # bed temp
      n_bed:
        obj: n1
        bind:
        - source: heater_bed.temperature
          attr: val
      # bed target text
      t_bed_tgt:
        obj: t9
        bind:
        - source: heater_bed.target
          format: /{:.0f}℃
      # chamber temp
      n_chamber:
        obj: n2
        bind:
        - source: heater_generic chamber.temperature
          attr: val
      # chamber target text
      t_chamber_tgt:
        obj: t10
        bind:
        - source: heater_generic chamber.target
          format: /{:.0f}℃
      # file base name (page 0x11)
      t_file:
        obj: t5
        bind:
        - source: derived.filename
      # current layer (print_stats.info.current_layer)
      n_layer:
        obj: n4
        bind:
        - source: derived.layer
          attr: val
      # total layers text "/N"
      t_total_layers:
        obj: t6
        bind:
        - source: derived.total_layers
          format: /{}
      # actual speed in mm/s (derived.speed_mms = gcode_move.speed * speed_factor / 60)
      n_speed_mms:
        obj: n3
        bind:
        - source: derived.speed_mms
          attr: val
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more
  # ----------------------------------------------------------------------

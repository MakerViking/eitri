          else_beep: 80
      # SET_GCODE_OFFSET Z_ADJUST=+<step> MOVE=1 (fixed 0.01 fallback)
      z_up:
        id: 11
        on_release:
        - gcode: SET_GCODE_OFFSET Z_ADJUST=+0.01 MOVE=1
          guard:
            source: derived.state
            in:
            - printing
            - paused
          else_beep: 80
      back:
        id: 12
        on_release:
        - page: printing
      # current z offset text
      t_zoffset:
        obj: t5
        bind:
        - source: gcode_move.homing_origin.2
          format: '{:.2f}'
      nav_control:
        id: 34
        on_release:
        - page: control
      nav_files:
        id: 35
        on_release:
        - page: files
      nav_tools:
        id: 36
        on_release:
        - page: tools
      nav_settings:
        id: 37
        on_release:
        - page: settings_more

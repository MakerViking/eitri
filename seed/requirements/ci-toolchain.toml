# What the CI workflow (and anyone without a Buildroot build tree) uses instead of the image's own Python and
# toolchain. Only the Python headers, its sysconfig data (for cross-compiling extension modules) and an aarch64
# CPython for the qemu-user smoke test come from here; the compiler is the distribution's gcc-aarch64-linux-gnu
# and the C library for qemu is libc6-arm64-cross. The ABI of CPython 3.14.x is stable across patch releases, so
# these headers build modules that the image's 3.14.5 loads (the qemu test proves it).
schema = 1


[project]
name = "eitri-configurator"
version = "0.1.0"
description = "Eitri first-run web configurator (wizard backend + offline frontend)"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "aiohttp>=3.13,<3.14",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eitri-configurator = "eitri_configurator.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eitri_configurator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
